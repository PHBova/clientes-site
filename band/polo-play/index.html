<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camisa polo · Play 99.7 · Prévia</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<link rel="icon" type="image/svg+xml" href="../../studio/hub/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Prévia de entrega · visor de uma tela (BC-009, polo Play 99.7).
   Modelo reaproveitável: visor, miniaturas e painel ficam; variantes, especificações e arquivo vêm do DATA em app.js.
   Design system da Apple em aparência clara, números do Xcode (Brain/Scripts/apple-metrics.swift, macOS 27.2.1):
   Large Title 26/32, Title 2 17/22, Body 13/16, Subheadline 11/14, controle extraLarge 36.
   Geist no lugar da SF e Phosphor Regular no lugar dos SF Symbols, por licença. */
:root {
  color-scheme: light;
  --under-page: #F6F6F6;
  --label: rgba(0, 0, 0, .85);
  --label-2: rgba(0, 0, 0, .5);
  --label-3: rgba(0, 0, 0, .26);
  --separator: rgba(0, 0, 0, .1);
  --fill-3: rgba(0, 0, 0, .05);
  --fill-4: rgba(0, 0, 0, .04);
  --fill-sel: rgba(0, 0, 0, .09);
  --focus: rgba(0, 122, 255, .5);
  --accent: #0F4CD8;                     /* azul da marca Play, só como acento de seleção e ação */
  --control: 36px;
  --panel: 304px;
  --font: "Geist", -apple-system, system-ui, sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--under-page); color: var(--label);
  font: 400 13px/16px var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
h1, h2, p, dl, dd { margin: 0; }

/* margem lateral proporcional à tela (~7% da largura, faixa 5 a 9% do Design Bova) e conteúdo com teto de largura,
   para a página não colar nas bordas em monitor largo */
.window { height: 100vh; min-width: 1024px; min-height: 640px; display: flex; flex-direction: column;
  width: 100%; max-width: 1760px; margin: 0 auto; padding: 32px clamp(56px, 7vw, 160px) 32px; }

.titlebar { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px;
  height: var(--control); flex: none; padding-bottom: 16px; box-sizing: content-box; border-bottom: 1px solid var(--separator); }
.collab { display: flex; align-items: center; gap: 12px; }
.collab .logo { display: block; flex: none; }
.collab .bova { height: 17px; width: 86px; }
.collab .client { height: 16px; width: auto; }
.collab .x { color: var(--label-2); }
.title { font: 600 17px/22px var(--font); letter-spacing: -.01em; white-space: nowrap; }
.title span { color: var(--label-2); font-weight: 400; }
.badge { justify-self: end; font: 400 11px/14px var(--font); color: var(--label-2); padding: 5px 10px; border-radius: 12px; background: var(--fill-3); white-space: nowrap; }

.body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) var(--panel); gap: 24px; padding-top: 24px; }

/* visor: a caixa tem a proporção da imagem (4:5), ocupa a altura livre e centraliza na coluna; sem sobra nos lados */
.viewer { display: flex; flex-direction: column; align-items: center; gap: 12px; min-height: 0; }
.hint { flex: none; text-align: center; font: 400 11px/14px var(--font); color: var(--label-2); }
.stage { position: relative; flex: 1 1 0; min-height: 0; aspect-ratio: 4 / 5; width: auto; max-width: 100%;
  border-radius: 12px; overflow: hidden; background: var(--fill-4); }
.photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .22s var(--ease); user-select: none; -webkit-user-drag: none; }
.photo.fade { opacity: 0; }

.glass { border-radius: 18px; background: rgba(255, 255, 255, .78);
  -webkit-backdrop-filter: blur(20px) saturate(1.8); backdrop-filter: blur(20px) saturate(1.8);
  box-shadow: 0 0 0 .5px var(--separator), 0 1px 3px rgba(0, 0, 0, .12), 0 4px 12px rgba(0, 0, 0, .06); }
.icon { width: var(--control); height: var(--control); display: grid; place-items: center; }
.icon svg { width: 16px; height: 16px; fill: currentColor; display: block; }
.icon:hover:not(:disabled) { background: #FFFFFF; }
.icon:active:not(:disabled) { background: rgba(236, 236, 236, .92); }
.nav { position: absolute; top: 50%; margin-top: -18px; }
.nav.prev { left: 16px; } .nav.next { right: 16px; }
.nav:disabled { opacity: 0; pointer-events: none; }
.counter { position: absolute; left: 16px; bottom: 16px; padding: 5px 12px; border-radius: 12px; font: 400 11px/14px var(--font); display: flex; gap: 6px; }
.counter b { font-weight: 500; }
.counter span { color: var(--label-2); font-variant-numeric: tabular-nums; }

.thumbs { flex: none; display: flex; justify-content: safe center; gap: 8px; height: 80px; margin-top: 4px; overflow-x: auto; scrollbar-width: none; }
.thumbs::-webkit-scrollbar { display: none; }
.thumbs button { flex: none; width: 64px; height: 80px; border-radius: 6px; overflow: hidden; position: relative; }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumbs button::after { content: ""; position: absolute; inset: 0; border-radius: 6px; box-shadow: inset 0 0 0 .5px var(--separator); transition: box-shadow .16s; }
.thumbs button:hover::after { box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .3); }
.thumbs button[aria-current="true"]::after { box-shadow: inset 0 0 0 2px var(--accent); }

/* painel */
.panel { display: flex; flex-direction: column; min-height: 0; }
.eyebrow { font: 500 11px/14px var(--font); color: var(--label-2); }
.name { font: 600 26px/32px var(--font); letter-spacing: -.015em; margin-top: 6px; }
.lead { color: var(--label-2); margin-top: 8px; }
hr { border: 0; height: 1px; background: var(--separator); margin: 20px 0 16px; }
.label b { font-weight: 600; } .label span { color: var(--label-2); }
/* variantes em cartão: miniatura, amostra, nome e contagem; a escolhida ganha contorno no azul da marca */
.variants { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.variants button { display: flex; flex-direction: column; gap: 8px; padding: 6px 6px 10px; border-radius: 12px; text-align: left;
  background: #FFFFFF; box-shadow: 0 0 0 .5px var(--separator), 0 1px 3px rgba(0, 0, 0, .08); cursor: pointer; transition: box-shadow .16s, transform .16s; }
.variants button:hover:not([aria-checked="true"]) { box-shadow: 0 0 0 1px rgba(0, 0, 0, .22), 0 4px 12px rgba(0, 0, 0, .08); }
.variants button[aria-checked="true"] { box-shadow: 0 0 0 2px var(--accent), 0 4px 12px rgba(15, 76, 216, .14); }
.variants img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; object-position: 50% 40%; border-radius: 7px; display: block; }
.variants span { display: flex; flex-direction: column; gap: 2px; padding: 0 4px; }
.variants b { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.variants small { font: 400 11px/14px var(--font); color: var(--label-2); padding-left: 16px; }
.variants i { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .25); }
.variants button[aria-checked="true"] small { color: var(--accent); }
.specs { margin-top: 20px; border-top: 1px solid var(--separator); }
.specs div { display: grid; grid-template-columns: 88px 1fr; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--separator); }
.specs dt { color: var(--label-2); }
.flex { flex: 1; min-height: 16px; }
.note { font: 400 11px/14px var(--font); color: var(--label-2); white-space: pre-line; }

button:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* opção do bordado do peito: cartões como os de cor, com o close do bordado; mais baixos, a foto é um recorte */
.opt-label { margin-top: 20px; }
.opts img { aspect-ratio: 16 / 9; object-position: 50% 50%; }
.opts small { padding-left: 0; }

</style>
</head>
<body>
<main class="window">
  <header class="titlebar">
    <p class="collab" aria-label="Bova Studio e Play 99.7">
      <img class="logo bova" src="assets/bova.svg" alt="Bova Studio">
      <span class="x" aria-hidden="true">×</span>
      <img class="logo client" src="assets/play.svg" alt="Play 99.7">
    </p>
    <h1 class="title">Camisa polo <span>Play 99.7</span></h1>
    <p class="badge">Prévia de estudo · imagens geradas para aprovação</p>
  </header>

  <div class="body">
    <section class="viewer" aria-label="Imagens">
      <div class="stage" id="stage">
        <img class="photo" id="photo" alt="">
        <button class="glass icon nav prev" id="prev" aria-label="Imagem anterior"><svg viewBox="0 0 256 256"><path d="M165.66 202.34a8 8 0 0 1-11.32 11.32l-80-80a8 8 0 0 1 0-11.32l80-80a8 8 0 0 1 11.32 11.32L91.31 128Z"/></svg></button>
        <button class="glass icon nav next" id="next" aria-label="Próxima imagem"><svg viewBox="0 0 256 256"><path d="m181.66 133.66l-80 80a8 8 0 0 1-11.32-11.32L164.69 128L90.34 53.66a8 8 0 0 1 11.32-11.32l80 80a8 8 0 0 1 0 11.32"/></svg></button>
        <p class="glass counter" aria-live="polite"><b id="cap"></b> <span id="idx"></span></p>
      </div>
      <nav class="thumbs" id="thumbs" aria-label="Miniaturas"></nav>
      <p class="hint">Use as setas do teclado ou clique numa miniatura para ver as outras imagens.</p>
    </section>

    <aside class="panel">
      <p class="eyebrow" id="eyebrow"></p>
      <h2 class="name" id="name"></h2>
      <p class="lead" id="lead"></p>
      <hr>
      <p class="label"><b id="vlabel"></b> <span id="vcount"></span></p>
      <div class="variants" id="seg" role="radiogroup"></div>
      <p class="label opt-label"><b id="olabel"></b></p>
      <div class="variants opts" id="opts" role="radiogroup"></div>
      <dl class="specs" id="specs"></dl>
      <div class="flex"></div>
      <p class="note" id="note"></p>
    </aside>
  </div>
</main>

<script>
// Prévia de entrega · visor de uma tela. O conteúdo do job vive todo em DATA; o resto é o modelo.
// Duas escolhas: a variante (aqui, a cor) e a opção (aqui, o bordado do peito). Imagem com `o` só aparece na opção dela;
// sem `o`, aparece nas duas.
const DATA = {
  eyebrow: 'Uniforme Play 99.7',
  name: 'Camisa polo',
  lead: 'Piquet de algodão com bordado fosco.',
  variantLabel: 'Cor',
  optionLabel: 'Bordado do peito',
  options: [
    { id: 'simbolo', label: 'Só o símbolo', size: '3,5 cm', spec: 'Símbolo de 3,5 cm em off-white' },
    { id: 'logo', label: 'Logo completo', size: '8 cm', spec: 'Logo de 8 cm em off-white' },
  ],
  note: 'Imagens geradas para aprovação do modelo.\nTecido e linha se aprovam por amostra física.',
  variants: [
    { id: 'marinho', label: 'Azul marinho', swatch: '#2A314E',
      specs: [['Tecido', 'Piquet de algodão, marinho'], ['Acabamento', 'Friso off-white']],
      images: [['navy-1', 'Frente', 'simbolo'], ['navy-9', 'Frente', 'logo'], ['navy-2', 'Frente', 'simbolo'], ['navy-4', 'Costas'],
        ['navy-6', 'Bordado do peito', 'simbolo'], ['navy-10', 'Bordado do peito', 'logo'], ['navy-7', 'Gola e peitilho'], ['navy-8', 'Nuca']] },
    { id: 'preta', label: 'Preta', swatch: '#2A2A2C',
      specs: [['Tecido', 'Piquet de algodão, preto'], ['Acabamento', 'Lisos, sem friso']],
      images: [['black-1', 'Frente', 'simbolo'], ['black-7', 'Frente', 'logo'], ['black-2', 'Frente', 'simbolo'], ['black-3', 'Costas'],
        ['black-4', 'Bordado do peito', 'simbolo'], ['black-8', 'Bordado do peito', 'logo'], ['black-5', 'Gola e peitilho'], ['black-6', 'Nuca']] },
  ],
};

const $ = (id) => document.getElementById(id);
const img = (k) => `assets/img/${k}.jpg`;
const th = (k) => `assets/th/${k}.jpg`;
let v = 0, o = 0, i = 0;
const list = (x = DATA.variants[v], op = DATA.options[o]) => x.images.filter(([, , t]) => !t || t === op.id);

$('eyebrow').textContent = DATA.eyebrow;
$('name').textContent = DATA.name;
$('lead').textContent = DATA.lead;
$('vlabel').textContent = DATA.variantLabel;
$('olabel').textContent = DATA.optionLabel;
$('note').textContent = DATA.note;
$('seg').setAttribute('aria-label', DATA.variantLabel);
$('opts').setAttribute('aria-label', DATA.optionLabel);
$('vcount').textContent = `${DATA.variants.length} opções, clique para trocar`;

// variante como cartão: miniatura da primeira imagem, amostra de cor, nome e quantas imagens tem
DATA.variants.forEach((x, n) => {
  const b = document.createElement('button');
  b.setAttribute('role', 'radio');
  b.innerHTML = `<img alt=""><span><b><i style="background:${x.swatch}"></i>${x.label}</b><small></small></span>`;
  b.onclick = () => set(n, o, 0);
  $('seg').append(b);
});
// opção também em cartão: o close do bordado da cor escolhida, nome e tamanho
DATA.options.forEach((x, n) => {
  const b = document.createElement('button');
  b.setAttribute('role', 'radio');
  b.innerHTML = `<img alt=""><span><b>${x.label}</b><small>${x.size} no peito</small></span>`;
  b.onclick = () => set(v, n, 0);
  $('opts').append(b);
});
// a imagem da opção: o close do peito dela na cor atual (a primeira imagem marcada com a opção, se não houver close)
const optThumb = (x, op) => (x.images.find(([, c, t]) => t === op.id && /peito/i.test(c)) || x.images.find(([, , t]) => t === op.id))[0];

function set(nv, no, at) {
  v = nv; o = no; const x = DATA.variants[v], op = DATA.options[o];
  [...$('seg').children].forEach((b, k) => {
    b.setAttribute('aria-checked', String(k === v));
    const l = list(DATA.variants[k], op);
    b.querySelector('img').src = th(l[0][0]); b.querySelector('small').textContent = `${l.length} imagens`;
  });
  [...$('opts').children].forEach((b, k) => { b.setAttribute('aria-checked', String(k === o)); b.querySelector('img').src = img(optThumb(x, DATA.options[k])); });
  const specs = [x.specs[0], ['Bordado', op.spec], ...x.specs.slice(1)];
  $('specs').innerHTML = specs.map(([k, val]) => `<div><dt>${k}</dt><dd>${val}</dd></div>`).join('');
  $('thumbs').innerHTML = '';
  list().forEach(([k, cap], m) => {
    const b = document.createElement('button');
    b.setAttribute('aria-label', `${cap}, imagem ${m + 1}`);
    b.innerHTML = `<img src="${th(k)}" alt="" loading="lazy">`;
    b.onclick = () => show(m);
    $('thumbs').append(b);
  });
  show(at, true);
}

function show(m, instant) {
  const x = DATA.variants[v], op = DATA.options[o], L = list(), n = L.length;
  i = Math.max(0, Math.min(n - 1, m));
  const [k, cap] = L[i];
  const photo = $('photo');
  const swap = () => { photo.src = img(k); photo.alt = `${DATA.name}, ${x.label.toLowerCase()}, ${op.label.toLowerCase()}, ${cap.toLowerCase()}`; };
  if (instant || !photo.src) swap();
  else { photo.classList.add('fade'); setTimeout(() => { swap(); photo.decode().catch(() => {}).finally(() => photo.classList.remove('fade')); }, 160); }
  $('cap').textContent = `${x.label} · ${cap}`;
  $('idx').textContent = `${i + 1} de ${n}`;
  $('prev').disabled = i === 0;
  $('next').disabled = i === n - 1;
  [...$('thumbs').children].forEach((b, t) => b.setAttribute('aria-current', String(t === i)));
  $('thumbs').children[i].scrollIntoView({ block: 'nearest', inline: 'nearest' });
  for (const d of [1, -1]) { const p = L[i + d]; if (p) new Image().src = img(p[0]); }
  history.replaceState(null, '', `#${x.id}-${op.id}-${i + 1}`);
}

$('prev').onclick = () => show(i - 1);
$('next').onclick = () => show(i + 1);
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') show(i - 1);
  if (e.key === 'ArrowRight') show(i + 1);
});
// toque: arrastar para o lado troca a imagem
let x0 = null;
$('stage').addEventListener('pointerdown', (e) => { x0 = e.clientX; });
$('stage').addEventListener('pointerup', (e) => {
  if (x0 === null) return; const dx = e.clientX - x0; x0 = null;
  if (Math.abs(dx) > 40) show(i + (dx < 0 ? 1 : -1));
});

// endereço: #marinho-logo-2 (cor, opção, imagem); o formato antigo #marinho-2 abre no símbolo
const h = location.hash.slice(1).split('-');
const sv = Math.max(0, DATA.variants.findIndex((x) => x.id === h[0]));
const so = Math.max(0, DATA.options.findIndex((x) => x.id === h[1]));
const si = Number(h.at(-1)) || 1;
set(sv, so, si - 1);

</script>
</body>
</html>
