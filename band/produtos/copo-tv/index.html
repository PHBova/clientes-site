<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copo TV Band · Band · Prévia</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<link rel="icon" type="image/svg+xml" href="../../../studio/hub/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Visor de produto Band (Mockup View v3, Figma ahgdwHfRHfAxi6fneicW0y, frame 68:154).
   Compartilhado por band/produtos/<produto>/: cada produto só traz data.js e assets/.
   Sistema: Apple claro (números do apple-metrics.swift), Geist no lugar da SF, Phosphor no lugar dos SF Symbols. */
:root {
  --bg: #F6F6F6;                 /* underPageBackground */
  --label: rgba(0, 0, 0, 0.9);
  --secondary: rgba(0, 0, 0, 0.5);
  --stage-bg: #ECECEC;
  --accent: #1B395D;             /* azul Band */
  --dot-light: #1E5BA1;          /* luz dos pontos em volta do ponteiro */
  --color-dot-base: rgba(27, 57, 93, 0.3);
  --stage-w: 882px;              /* 4:3 */
  --stage-h: 662px;
  --radius-stage: 12px;
  --radius-thumb: 8px;
  --s1: 4px; --s2: 8px; --s3: 16px; --s4: 24px; --s5: 40px;
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; }
html, body { background: var(--bg); }
body { font-family: 'Geist', -apple-system, system-ui, sans-serif; color: var(--label); -webkit-font-smoothing: antialiased; }
#dots { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
.page { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 30px 16px var(--s5); }

.collab { display: flex; align-items: center; gap: 14px; height: 40px; }
.collab .bova { height: 20.4px; width: auto; }
.collab .band { height: 38px; width: auto; }
.collab .x { font-size: 15.6px; color: var(--secondary); line-height: 1; }

.stage { position: relative; width: min(var(--stage-w), 100%); aspect-ratio: 882 / 662; margin-top: 38px; border-radius: var(--radius-stage); overflow: hidden; background: var(--stage-bg); touch-action: pan-y; }
.stage img.photo { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity 0.16s ease; }
.stage img.photo.fade { opacity: 0; }
.stage:fullscreen { background: #000; border-radius: 0; width: 100vw; height: 100vh; aspect-ratio: auto; }
.stage:fullscreen img.photo { object-fit: contain; }

/* Liquid Glass: vidro quase transparente, contorno fino, brilho especular na borda de cima e sombra macia. */
.glass {
  background: rgba(255, 255, 255, 0.10);
  border: 0.5px solid rgba(255, 255, 255, 0.35);
  -webkit-backdrop-filter: blur(3px) saturate(1.6) brightness(1.06);
  backdrop-filter: blur(3px) saturate(1.6) brightness(1.06);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18),
    inset 0 1px 0.5px rgba(255, 255, 255, 0.55),
    inset 0 -1px 0.5px rgba(255, 255, 255, 0.14),
    inset 1px 0 0.5px rgba(255, 255, 255, 0.16),
    inset -1px 0 0.5px rgba(255, 255, 255, 0.16);
  color: #fff;
}
button.glass, a.glass { position: absolute; width: 36px; height: 36px; border-radius: 18px; display: grid; place-items: center; cursor: pointer; padding: 0; transition: transform 0.15s ease, background 0.15s ease; }
button.glass:hover, a.glass:hover { background: rgba(255, 255, 255, 0.18); }
button.glass:active, a.glass:active { transform: scale(0.94); }
button.glass:disabled { opacity: 0.35; cursor: default; }
.glass svg { width: 16px; height: 16px; fill: currentColor; }
.prev { left: 16px; top: calc(50% - 18px); }
.next { right: 16px; top: calc(50% - 18px); }
.full { right: 60px; top: 16px; }
.down { right: 16px; top: 16px; }
.caption { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: baseline; gap: 8px; padding: 9px 16px; border-radius: 18px; white-space: nowrap; max-width: calc(100% - 32px); }
.caption b { font-size: 15px; line-height: 20px; font-weight: 600; }
.caption span { font-size: 13px; line-height: 16px; color: rgba(255, 255, 255, 0.8); overflow: hidden; text-overflow: ellipsis; }

.info { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 24px; margin-top: 16px; list-style: none; padding: 0; color: var(--secondary); font-size: 13px; line-height: 16px; }
.info li { display: flex; align-items: center; gap: 6px; }
.info svg { width: 16px; height: 16px; fill: currentColor; flex: none; }

.thumbs { display: flex; gap: 24px; margin-top: 24px; overflow-x: auto; max-width: 100%; padding: 2px; scrollbar-width: none; }
.thumbs::-webkit-scrollbar { display: none; }
.thumbs button { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 12px; width: 162px; flex: none; }
.thumbs img { width: 162px; height: 122px; object-fit: cover; border-radius: var(--radius-thumb); background: var(--stage-bg); display: block; outline: 2px solid transparent; outline-offset: -2px; transition: outline-color 0.15s ease; }
.thumbs span { font-size: 11px; line-height: 14px; text-align: center; color: var(--secondary); }
.thumbs [aria-current="true"] img { outline-color: var(--accent); }
.thumbs [aria-current="true"] span { color: var(--label); font-weight: 500; }
.thumbs button:focus-visible img { outline-color: var(--dot-light); }

@media (max-width: 600px) {
  .stage { margin-top: 24px; }
  .caption { flex-direction: column; align-items: center; gap: 0; padding: 7px 14px; }
  .thumbs { gap: 12px; }
  .thumbs button, .thumbs img { width: 104px; } .thumbs img { height: 78px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

</style>
</head>
<body>
<canvas id="dots" aria-hidden="true"></canvas>
<main class="page">
  <p class="collab" aria-label="Bova Studio e Band">
    <img class="bova" src="../assets/bova.svg" alt="Bova Studio">
    <span class="x" aria-hidden="true">×</span>
    <img class="band" src="../assets/band-tv.png" alt="Band">
  </p>

  <section class="stage" id="stage" aria-label="Imagens do produto">
    <img class="photo" id="photo" alt="">
    <button class="glass prev" id="prev" aria-label="Imagem anterior"><svg viewBox="0 0 256 256"><path d="M165.66 202.34a8 8 0 0 1-11.32 11.32l-80-80a8 8 0 0 1 0-11.32l80-80a8 8 0 0 1 11.32 11.32L91.31 128Z"/></svg></button>
    <button class="glass next" id="next" aria-label="Próxima imagem"><svg viewBox="0 0 256 256"><path d="m181.66 133.66l-80 80a8 8 0 0 1-11.32-11.32L164.69 128L90.34 53.66a8 8 0 0 1 11.32-11.32l80 80a8 8 0 0 1 0 11.32"/></svg></button>
    <button class="glass full" id="full" aria-label="Tela cheia"><svg viewBox="0 0 256 256"><path d="M216 48v48a8 8 0 0 1-16 0V67.31l-42.34 42.35a8 8 0 0 1-11.32-11.32L188.69 56H160a8 8 0 0 1 0-16h48a8 8 0 0 1 8 8M98.34 146.34L56 188.69V160a8 8 0 0 0-16 0v48a8 8 0 0 0 8 8h48a8 8 0 0 0 0-16H67.31l42.35-42.34a8 8 0 0 0-11.32-11.32M208 152a8 8 0 0 0-8 8v28.69l-42.34-42.35a8 8 0 0 0-11.32 11.32L188.69 200H160a8 8 0 0 0 0 16h48a8 8 0 0 0 8-8v-48a8 8 0 0 0-8-8M67.31 56H96a8 8 0 0 0 0-16H48a8 8 0 0 0-8 8v48a8 8 0 0 0 16 0V67.31l42.34 42.35a8 8 0 0 0 11.32-11.32Z"/></svg></button>
    <a class="glass down" id="down" aria-label="Baixar imagem em tamanho cheio"><svg viewBox="0 0 256 256"><path d="M224 144v64a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8v-64a8 8 0 0 1 16 0v56h160v-56a8 8 0 0 1 16 0m-101.66 5.66a8 8 0 0 0 11.32 0l40-40a8 8 0 0 0-11.32-11.32L136 124.69V32a8 8 0 0 0-16 0v92.69L93.66 98.34a8 8 0 0 0-11.32 11.32Z"/></svg></a>
    <p class="glass caption" aria-live="polite"><b id="ctitle"></b><span id="cdetail"></span></p>
  </section>

  <ul class="info" id="info"></ul>
  <nav class="thumbs" id="thumbs" aria-label="Vistas"></nav>
</main>
<script>
// Copo TV Band (BC-015). Só o conteúdo do produto; o visor está em ../_viewer/.
// Na página vai só o nome do que é: nada de medida técnica, processo ou ferramenta (regra do Bova, 19/11/2026).
window.PRODUCT = {
  client: 'Band',
  title: 'Copo TV Band',
  info: [['coffee', 'Copo TV Band']],
  views: [
    { id: 'render', label: 'Render', title: 'Copos flutuando', download: 'copo-tv-band_mockup.jpg' },
    { id: 'arte', label: 'Arte planificada', title: 'Arte planificada', download: 'copo-tv-band_arte.png' },
    { id: 'faca', label: 'Arte com faca', title: 'Arte com faca', download: 'copo-tv-band_arte-com-faca.png' },
  ],
};

</script>
<script>
// Visor de produto Band. Lê window.PRODUCT (data.js do produto) e monta a página.
// Imagens: assets/img/<id>.jpg (visor, 2x), assets/th/<id>.jpg (miniatura) e assets/full/<arquivo> (download).
// Endereço: #<id da vista>. Teclado: setas. Toque: arrastar para o lado.
(() => {
  const P = window.PRODUCT;
  const $ = (id) => document.getElementById(id);
  const ICON = {
    coffee: 'M80 56V24a8 8 0 0 1 16 0v32a8 8 0 0 1-16 0m40 8a8 8 0 0 0 8-8V24a8 8 0 0 0-16 0v32a8 8 0 0 0 8 8m32 0a8 8 0 0 0 8-8V24a8 8 0 0 0-16 0v32a8 8 0 0 0 8 8m96 56v8a40 40 0 0 1-37.51 39.91a96.6 96.6 0 0 1-27 40.09H208a8 8 0 0 1 0 16H32a8 8 0 0 1 0-16h24.54A96.3 96.3 0 0 1 24 136V88a8 8 0 0 1 8-8h176a40 40 0 0 1 40 40m-48-24H40v40a80.27 80.27 0 0 0 45.12 72h69.76A80.27 80.27 0 0 0 200 136Zm32 24a24 24 0 0 0-16-22.62V136a96 96 0 0 1-1.2 15a24 24 0 0 0 17.2-23Z',
    ruler: 'm235.32 73.37l-52.69-52.68a16 16 0 0 0-22.63 0L20.68 160a16 16 0 0 0 0 22.63l52.69 52.68a16 16 0 0 0 22.63 0L235.32 96a16 16 0 0 0 0-22.63M84.68 224L32 171.31l32-32l26.34 26.35a8 8 0 0 0 11.32-11.32L75.31 128L96 107.31l26.34 26.35a8 8 0 0 0 11.32-11.32L107.31 96L128 75.31l26.34 26.35a8 8 0 0 0 11.32-11.32L139.31 64l32-32L224 84.69Z',
    cube: 'm223.68 66.15l-88-48.15a15.88 15.88 0 0 0-15.36 0l-88 48.17a16 16 0 0 0-8.32 14v95.64a16 16 0 0 0 8.32 14l88 48.17a15.88 15.88 0 0 0 15.36 0l88-48.17a16 16 0 0 0 8.32-14V80.18a16 16 0 0 0-8.32-14.03M128 32l80.34 44L128 120L47.66 76ZM40 90l80 43.78v85.79l-80-43.75Zm96 129.57v-85.75L216 90v85.78Z',
    eye: 'M247.31 124.76c-.35-.79-8.82-19.58-27.65-38.41C194.57 61.26 162.88 48 128 48S61.43 61.26 36.34 86.35C17.51 105.18 9 124 8.69 124.76a8 8 0 0 0 0 6.5c.35.79 8.82 19.57 27.65 38.4C61.43 194.74 93.12 208 128 208s66.57-13.26 91.66-38.34c18.83-18.83 27.3-37.61 27.65-38.4a8 8 0 0 0 0-6.5M128 192c-30.78 0-57.67-11.19-79.93-33.25A133.5 133.5 0 0 1 25 128a133.3 133.3 0 0 1 23.07-30.75C70.33 75.19 97.22 64 128 64s57.67 11.19 79.93 33.25A133.5 133.5 0 0 1 231.05 128c-7.21 13.46-38.62 64-103.05 64m0-112a48 48 0 1 0 48 48a48.05 48.05 0 0 0-48-48m0 80a32 32 0 1 1 32-32a32 32 0 0 1-32 32',
  };
  const svg = (d) => `<svg viewBox="0 0 256 256" aria-hidden="true"><path d="${d}"/></svg>`;

  document.title = `${P.title} · ${P.client} · Prévia`;
  $('info').innerHTML = P.info.map(([ic, t]) => `<li>${ICON[ic] ? svg(ICON[ic]) : ''}<span>${t}</span></li>`).join('');
  P.views.forEach((v, n) => {
    const b = document.createElement('button');
    b.setAttribute('aria-label', `${v.label}, imagem ${n + 1} de ${P.views.length}`);
    b.innerHTML = `<img src="assets/th/${v.id}.jpg" alt="" loading="lazy"><span>${v.label}</span>`;
    b.onclick = () => show(n);
    $('thumbs').append(b);
  });

  let i = 0;
  function show(m, instant) {
    i = Math.max(0, Math.min(P.views.length - 1, m));
    const v = P.views[i]; const photo = $('photo');
    const swap = () => { photo.src = `assets/img/${v.id}.jpg`; photo.alt = `${P.title}: ${v.title}`; };
    if (instant || !photo.getAttribute('src')) swap();
    else { photo.classList.add('fade'); setTimeout(() => { swap(); photo.decode().catch(() => {}).finally(() => photo.classList.remove('fade')); }, 160); }
    $('ctitle').textContent = v.title; $('cdetail').textContent = v.detail || ''; $('cdetail').hidden = !v.detail;
    $('down').href = `assets/full/${v.download}`; $('down').setAttribute('download', v.download);
    $('prev').disabled = i === 0; $('next').disabled = i === P.views.length - 1;
    [...$('thumbs').children].forEach((b, t) => b.setAttribute('aria-current', String(t === i)));
    for (const d of [1, -1]) { const p = P.views[i + d]; if (p) new Image().src = `assets/img/${p.id}.jpg`; }
    history.replaceState(null, '', `#${v.id}`);
  }

  $('prev').onclick = () => show(i - 1);
  $('next').onclick = () => show(i + 1);
  $('full').onclick = () => {
    const s = $('stage');
    if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else (s.requestFullscreen || s.webkitRequestFullscreen).call(s);
  };
  addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') show(i - 1); if (e.key === 'ArrowRight') show(i + 1); });
  let x0 = null;
  $('stage').addEventListener('pointerdown', (e) => { if (!e.target.closest('.glass')) x0 = e.clientX; });
  $('stage').addEventListener('pointerup', (e) => { if (x0 === null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 40) show(i + (dx < 0 ? 1 : -1)); });

  const start = Math.max(0, P.views.findIndex((v) => v.id === location.hash.slice(1)));
  show(start, true);
})();

</script>
<script>
// Cópia do band/dashboard/dots.js (que vem de _base/signature/dots.js) para o visor de produtos da Band.
// (sólida, troca com o tema) no lugar do branco a 7%, que some no modo claro.
// Campo de pontos do fundo da página: o pattern da Bova (ponto de 2 px em grade de 16) que
// acende como luz em volta do ponteiro. A cor vem de --dot-light; a base, de --dot-base.
// Sem ponteiro (toque, ou antes do primeiro movimento) a luz descansa no canto de baixo à direita.
// prefers-reduced-motion: a luz não segue o ponteiro, fica parada nesse canto.

(() => {
  const cv = document.getElementById('dots');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const hex = (v, d) => (v || d).trim();
  let rgb = [0, 0, 0]; let BASE = '#1E1E1E';
  function colors() {
    const css = getComputedStyle(document.documentElement);
    const LIGHT = hex(css.getPropertyValue('--dot-light'), '#7C94D5');
    rgb = [1, 3, 5].map((i) => parseInt(LIGHT.slice(i, i + 2), 16));
    BASE = hex(css.getPropertyValue('--color-dot-base'), '#1E1E1E');
  }
  colors();
  const GRID = 16;
  const RADIUS = 220;          // alcance da luz, em px
  const BASE_ALPHA = 0.07;     // ponto apagado
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 0; let H = 0; let dpr = 1;
  const rest = () => ({ x: W - 24, y: H * 0.6 }); // margem direita, atrás dos cards e longe do rodapé (no dashboard)
  let target = null; let pos = null; let raf = 0;

  function size() {
    dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!target) target = rest();
    if (!pos) pos = { ...target };
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const r2 = RADIUS * RADIUS;
    for (let y = GRID / 2; y < H; y += GRID) {
      for (let x = GRID / 2; x < W; x += GRID) {
        const dx = x - pos.x; const dy = y - pos.y;
        const lv = Math.exp(-(dx * dx + dy * dy) / r2 * 2.2);
        const a = BASE_ALPHA + lv * 0.85;
        const rr = 1 + lv * 0.9;
        ctx.fillStyle = lv > 0.02
          ? `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a.toFixed(3)})`
          : BASE;
        ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  // A luz segue o ponteiro com atraso (lerp), para ler como luz e não como cursor.
  function tick() {
    pos.x += (target.x - pos.x) * 0.14;
    pos.y += (target.y - pos.y) * 0.14;
    draw();
    raf = Math.hypot(target.x - pos.x, target.y - pos.y) > 0.5 ? requestAnimationFrame(tick) : 0;
  }
  function aim(x, y) {
    target = { x, y };
    if (!raf) raf = requestAnimationFrame(tick);
  }

  addEventListener('resize', size);
  matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { colors(); draw(); });
  if (!still) {
    addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') aim(e.clientX, e.clientY); }, { passive: true });
    document.addEventListener('mouseleave', () => { const r = rest(); aim(r.x, r.y); });
  }
  size();
})();

</script>
