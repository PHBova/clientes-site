<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RetroOS · Backlog</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/svg+xml" href="../../studio/hub/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Studio Design System · tokens comuns a todas as páginas do Studio (hub, Finances, Backlog e as próximas).
   Fonte: vault Bova/Studio Hub/Studio Design System.md e o Figma "Studio · Hub" (coleção Semantic).
   Cada página declara só o seu acento (--color-accent, --color-bg-navActive, --dot-light). Valor solto é defeito. */
:root {
  color-scheme: dark;
  /* cor */
  --color-bg-app: #1B1A1A;
  --color-bg-panel: #272626;
  --color-bg-surface: #303030;
  --color-bg-chip: #353535;
  --color-bg-track: #3A3A3A;
  --color-bg-knob: #464646;
  --color-bg-scrim: rgba(0, 0, 0, .6);
  --color-border-default: #2F3030;
  --color-text-primary: #FFFFFF;
  --color-text-secondary: #A6ABB3;
  --color-text-tertiary: #888A96;
  --color-text-faint: #5B5B5B;
  --color-text-onAccent: #000000;
  --color-state-positive: #66CD7D;
  --color-state-negative: #FFA8AD;
  --color-state-warning: #FF9230;
  --color-dot-base: #2A2929;
  /* acento por tema (regra T5): Money, Play, Work */
  --color-theme-money: #66CD7D;
  --color-theme-play: #F3D27A;
  --color-theme-work: #FF2F00;
  /* tipo */
  --font-text: "Geist", ui-sans-serif, system-ui, sans-serif;
  --font-num: "Geist Mono", ui-monospace, monospace;
  /* forma */
  --radius-panel: 24px;
  --radius-card: 24px;
  --radius-control: 12px;
  --radius-chip: 8px;
  --radius-pill: 999px;
  --control: 44px;
  /* página: conteúdo de 1280 centrado, margem de 80 (a largura do hub, padrão de todas as páginas) */
  --page-max: 1280px;
  --page-margin: 80px;
  --ease: cubic-bezier(.2, .7, .2, 1);
}

/* Escala de tipo (Studio Design System, Tipografia) */
.t-display { font: 300 44px/48px var(--font-text); letter-spacing: -0.02em; }
.t-number { font: 300 32px/36px var(--font-text); letter-spacing: -0.02em; }
.t-title { font: 500 22px/28px var(--font-text); }
.t-headline { font: 500 16px/20px var(--font-text); }
.t-body { font: 400 15px/20px var(--font-text); }
.t-callout { font: 400 13px/16px var(--font-text); }
.t-label { font: 400 12px/16px var(--font-num); }
.t-caption { font: 400 11px/14px var(--font-text); }
.c-2 { color: var(--color-text-secondary); }
.c-3 { color: var(--color-text-tertiary); }
.c-4 { color: var(--color-text-faint); }

</style>
<style>
/* Studio Design System · a moldura comum das páginas de projeto (Finances, Backlog e as próximas).
   Tirada do Finances, que é o molde: trilho de ícones, cabeçalho, pílulas, botões, segmentado,
   avatar que volta ao hub, rodapé e o fundo de pontos. O hub tem layout próprio e usa só os tokens. */
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--color-bg-app); color: var(--color-text-primary); font: 400 13px/1.3 var(--font-text); -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
h1, h2, p { margin: 0; }
.mono { font-family: var(--font-num); }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }

#dots { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

/* janela (padrão do Bova, 10/11/2026): o conteúdo tem a largura do hub Studio., 1280 centrado na tela,
   com margem de 80 de cada lado; o trilho mora na margem esquerda, fixo, fora da coluna de conteúdo. */
.app { position: relative; z-index: 1; min-height: 100vh; min-width: 1180px; }
.rail { position: fixed; left: 0; top: 0; z-index: 5; width: var(--page-margin); height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 28px 0; gap: 20px; }
.rail .mark { width: 40px; height: 40px; border-radius: 20px; background: var(--color-accent); color: var(--color-text-onAccent); display: grid; place-items: center; font-weight: 600; font-size: 17px; text-decoration: none; }
.rail .grow { flex: 1; }
.navbtn { position: relative; width: 48px; height: 48px; border-radius: 24px; background: var(--color-bg-panel); display: grid; place-items: center; color: var(--color-text-primary); text-decoration: none; transition: background .2s; }
.navbtn svg.i { width: 22px; height: 22px; }
.navbtn[aria-current="page"] { background: var(--color-bg-navActive); color: var(--color-accent); box-shadow: inset 0 0 0 2px var(--color-accent); }
.navbtn:hover:not([aria-current]) { background: var(--color-bg-surface); }
.navbtn .bdot { width: 12px; height: 12px; border-radius: 50%; background: var(--b); }
/* etiqueta do trilho: nome do item ao lado, no hover e no foco */
.navbtn[data-tip]::after { content: attr(data-tip); position: absolute; left: calc(100% + 12px); top: 50%; transform: translate(-4px, -50%); padding: 8px 12px; border-radius: 10px; background: var(--color-bg-surface); color: var(--color-text-primary); font: 500 12px/16px var(--font-text); white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .16s, transform .16s; z-index: 30; }
.navbtn[data-tip]:hover::after, .navbtn[data-tip]:focus-visible::after { opacity: 1; transform: translate(0, -50%); }
.main { width: 100%; max-width: calc(var(--page-max) + 2 * var(--page-margin)); margin: 0 auto; padding: 28px var(--page-margin) 32px; display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.header { display: flex; align-items: center; justify-content: space-between; height: var(--control); gap: 16px; }
.header .actions { display: flex; gap: 8px; align-items: center; }

/* controles de 44 */
.pill { height: var(--control); border-radius: 22px; box-shadow: inset 0 0 0 1px var(--color-bg-track); display: inline-flex; align-items: center; gap: 10px; padding: 0 16px; color: var(--color-text-secondary); }
.pill input { background: none; border: 0; outline: 0; width: 160px; color: var(--color-text-primary); }
.pill input::placeholder { color: var(--color-text-tertiary); }
.pill select { appearance: none; background: none; border: 0; outline: 0; color: var(--color-text-primary); padding-right: 4px; cursor: pointer; }
.circle { width: var(--control); height: var(--control); border-radius: 22px; display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--color-bg-track); }
.circle.fill { background: var(--color-accent); color: var(--color-text-onAccent); box-shadow: none; }
.circle.sm { width: 36px; height: 36px; }
.avatar { width: var(--control); height: var(--control); border-radius: 22px; object-fit: cover; background: var(--color-bg-knob); }
.btn { height: var(--control); border-radius: 22px; padding: 0 18px 0 14px; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; text-decoration: none; }
.btn.primary { background: var(--color-accent); color: var(--color-text-onAccent); }
.btn.ghost { box-shadow: inset 0 0 0 1px var(--color-bg-track); font-weight: 500; padding: 0 20px 0 16px; }
.btn.ghost svg.i { color: var(--color-text-secondary); }
.seg { display: inline-flex; gap: 2px; padding: 4px; border-radius: 22px; box-shadow: inset 0 0 0 1px var(--color-bg-track); }
.seg button { height: 36px; border-radius: 18px; padding: 0 16px; color: var(--color-text-secondary); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--color-bg-track); color: var(--color-text-primary); font-weight: 500; }
.seg .k { font: 400 12px/16px var(--font-num); color: var(--color-text-tertiary); }

/* painel */
.panel { background: var(--color-bg-panel); border-radius: var(--radius-panel); padding: 24px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* avatar do Bova: volta ao hub Studio. (mesmo desenho e mesmo canto em todo projeto) */
.home { position: relative; display: block; border-radius: 50%; line-height: 0; }
.home img { display: block; transition: box-shadow .16s; }
.home:hover img, .home:focus-visible img { box-shadow: 0 0 0 2px var(--color-text-primary); }
.home:focus-visible { outline: none; }
.home::after { content: attr(data-tip); position: absolute; top: calc(100% + 8px); right: 0; padding: 8px 12px; border-radius: 10px; background: var(--color-bg-surface); color: var(--color-text-primary); font: 500 12px/16px var(--font-text); white-space: nowrap; opacity: 0; transform: translateY(-4px); pointer-events: none; transition: opacity .16s, transform .16s; z-index: 30; }
.home:hover::after, .home:focus-visible::after { opacity: 1; transform: none; }

/* hero: faixa de imagem com véus e legenda (hub e Backlog) */
.s-hero { position: relative; height: 320px; border-radius: var(--radius-card); overflow: hidden; background: var(--color-bg-panel); flex: none; }
.s-hero .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .6s var(--ease); }
.s-hero .art.on { opacity: 1; }
.s-hero .scrim { position: absolute; inset: auto 0; z-index: auto; pointer-events: none; }
.s-hero .scrim.top { top: 0; height: 120px; background: linear-gradient(rgba(0, 0, 0, .4), rgba(0, 0, 0, 0)); }
.s-hero .scrim.bottom { bottom: 0; height: 220px; background: linear-gradient(rgba(0, 0, 0, 0), rgba(0, 0, 0, .72)); }
.s-hero .caption { position: absolute; right: 32px; top: 32px; font: 400 12px/16px var(--font-num); color: rgba(255, 255, 255, .8); }

/* rodapé: Studio. e a origem à esquerda, o projeto à direita */
.footer { display: flex; justify-content: space-between; gap: 16px; font-size: 11px; line-height: 14px; color: var(--color-text-faint); }
.footer a { color: inherit; }
.footer .back { text-decoration: none; }
.footer .back:hover { color: var(--color-text-primary); }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--color-bg-surface); box-shadow: inset 0 0 0 1px var(--color-bg-track); padding: 12px 18px; border-radius: 22px; z-index: 20; display: flex; gap: 12px; align-items: center; font-size: 13px; }
.toast.err { box-shadow: inset 0 0 0 1px var(--color-state-negative); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

</style>
<style>
/* RetroOS · Backlog. Moldura, cor e tipo vêm de _base/studio (Studio Design System); aqui fica só o que é
   da página: acento do tema Play (dourado do ring-achievement do app), cores de marca, hero, tabela e edição.
   Figma: "RetroOS · Dashboard", seção "Desktop · v2 · Studio. system". */
:root {
  --color-accent: var(--color-theme-play);
  --color-bg-navActive: #6E5F37;
  --dot-light: #F3D27A;
  --color-beaten: #F3D27A;
  --color-beaten-track: #C8962E;
  --color-beaten-dim: rgba(243, 210, 122, .1);
  --brand-nintendo: #E60012;
  --brand-sony: #0070D1;
  --brand-microsoft: #107C10;
  --brand-sega: #0089CF;
  --brand-outros: #9A9A9A;
  --row: 56px;
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.grow { flex: 1 1 auto; }

/* Tipo legado do editor, na escala nova */
.t-title2 { font: 500 22px/28px var(--font-text); }
.t-sub { font-size: 15px; line-height: 20px; }
.t-foot { font-size: 13px; line-height: 16px; }
.t-cap { font-size: 11px; line-height: 14px; }
.c2 { color: var(--color-text-secondary); }
.c3 { color: var(--color-text-tertiary); }

/* Cabeçalho */
.title-line { display: flex; align-items: baseline; gap: 12px; min-width: 0; white-space: nowrap; overflow: hidden; }
.pill.search input { width: 168px; }
.navbtn.studio { margin-top: 0; }

/* Hero: arte do último zerado e os números por cima */
.s-hero .stats { position: absolute; left: 32px; right: 32px; bottom: 32px; display: flex; align-items: flex-end; gap: 24px; }
.stat { display: flex; flex-direction: column; gap: 4px; }
.stat .l { font: 400 12px/16px var(--font-num); color: rgba(255, 255, 255, .7); }
.stat .v { display: flex; align-items: baseline; gap: 6px; }
.stat .n { font: 300 32px/36px var(--font-text); letter-spacing: -0.02em; }
.stat .s { font-size: 15px; line-height: 20px; color: rgba(255, 255, 255, .6); white-space: nowrap; }
.stat.gold .n { color: var(--color-beaten); }
.s-hero .rule { width: 1px; height: 40px; background: rgba(255, 255, 255, .2); flex: none; margin-bottom: 4px; }
.spark { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.spark .l { font: 400 11px/14px var(--font-num); color: rgba(255, 255, 255, .6); }
.spark .bars { display: flex; align-items: flex-end; gap: 3px; height: 36px; }
.spark .bars i { width: 6px; min-height: 2px; border-radius: 2px 2px 0 0; background: #FFFFFF; opacity: .35; display: block; }
.spark .bars i.now { background: var(--color-beaten); opacity: 1; }

/* Tabela */
.table-card { gap: 16px; }
.table-head { display: flex; align-items: center; gap: 12px; }
.table-title { flex: 1 1 auto; display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.pill.sys { gap: 8px; padding: 0 14px 0 18px; }
.pill.sys select { max-width: 220px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 132px 120px 120px 80px 64px 20px; gap: 24px; align-items: center; padding: 0 12px; }
.system-scope .cols { grid-template-columns: minmax(0, 1fr) 120px 120px 80px 64px 20px; }
.system-scope .c-sys { display: none; }
.thead { height: 40px; border-bottom: 1px solid var(--color-border-default); }
.thead button { text-align: left; color: var(--color-text-tertiary); font: 400 12px/16px var(--font-num); }
.thead button[aria-sort]::after { content: attr(data-arrow); margin-left: 4px; }
.thead .r { text-align: right; }
.tbody { position: relative; overflow-y: auto; height: calc(var(--row) * var(--rows, 13.5)); overscroll-behavior: contain; outline: none; scrollbar-width: thin; scrollbar-color: var(--color-bg-track) transparent; }
.tsize { width: 1px; }
.row { position: absolute; left: 0; right: 0; height: var(--row); border-radius: var(--radius-control); cursor: default; border-bottom: 1px solid var(--color-border-default); }
.editable .row { cursor: pointer; }
.row:hover { background: var(--color-bg-surface); }
.row.beaten { background: var(--color-beaten-dim); border-bottom-color: transparent; }
.row .t { font-size: 15px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.beaten .t { color: var(--color-beaten); }
.row .sub { font-size: 13px; line-height: 16px; color: var(--color-text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .cell { font-size: 13px; line-height: 16px; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .c-beaten, .row .c-hours { font-family: var(--font-num); }
.row .r { text-align: right; }
.row .meta { display: none; }
.tag { display: inline-flex; align-items: center; gap: 8px; color: var(--color-text-secondary); }
.tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--b); flex: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 12px 0 10px; border-radius: var(--radius-chip); background: var(--color-bg-chip); font-size: 12px; line-height: 16px; font-weight: 500; color: var(--color-text-secondary); }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--color-text-tertiary); }
.chip.Beaten::before { background: var(--color-beaten); }
.pips { display: inline-flex; gap: 4px; }
.pips i { width: 6px; height: 6px; border-radius: 50%; background: var(--color-bg-track); display: block; }
.pips i.on { background: var(--color-text-secondary); }
.edit-ico { opacity: 0; color: var(--color-text-secondary); }
.editable .row:hover .edit-ico { opacity: 1; }
.empty { padding: 32px 12px; text-align: center; color: var(--color-text-secondary); font-size: 15px; }
.empty .btn { margin-left: 8px; }

/* Sistemas da marca */
.systems { display: flex; flex-direction: column; gap: 16px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
.tile { background: var(--color-bg-panel); border-radius: var(--radius-card); padding: 20px; display: flex; flex-direction: column; gap: 14px; text-decoration: none; transition: background .16s; }
.tile:hover { background: var(--color-bg-chip); }
.tile .wm { height: 40px; display: flex; align-items: center; color: var(--color-text-primary); }
.tile .wm svg { display: block; max-width: 100%; height: auto; }
.tile .nums { display: flex; align-items: baseline; justify-content: space-between; font-size: 13px; line-height: 16px; }
.tile .nums b { font-weight: 500; }
.bar { height: 4px; border-radius: var(--radius-pill); background: var(--color-bg-track); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--color-beaten); border-radius: var(--radius-pill); }

/* Edição */
.ico { width: 20px; height: 20px; display: inline-flex; flex: none; color: var(--color-text-secondary); }
.ico svg { width: 100%; height: 100%; }
#scrim { position: fixed; inset: 0; background: var(--color-bg-scrim); z-index: 10; }
.editor { position: fixed; z-index: 11; top: 16px; right: 16px; bottom: auto; width: 456px; max-height: calc(100vh - 32px); overflow-y: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 20px; background: var(--color-bg-panel); border-radius: var(--radius-panel); box-shadow: inset 0 0 0 1px var(--color-border-default); }
.editor hr { border: 0; height: 1px; background: var(--color-border-default); margin: 0; }
.handle { display: none; }
.ed-head { display: flex; align-items: center; gap: 12px; }
.ed-titles { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ed-meta { display: flex; align-items: center; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
.field > span { font-size: 12px; line-height: 16px; color: var(--color-text-tertiary); }
.field input, .field select { height: var(--control); border: 0; border-radius: 14px; background: var(--color-bg-chip); padding: 0 16px; color: var(--color-text-primary); outline: none; width: 100%; font-size: 15px; }
.field input:focus, .field select:focus { box-shadow: inset 0 0 0 1.5px var(--color-accent); }
.field-row { display: flex; gap: 16px; }
.seg.wide { display: flex; width: 100%; }
.seg.wide button { flex: 1; justify-content: center; }
#ed-status button[data-v="Beaten"][aria-checked="true"] { color: var(--color-beaten); }
.pips-edit { display: flex; align-items: center; gap: 8px; }
.pips-edit button { width: 20px; height: 20px; padding: 4px; }
.pips-edit button::before { content: ""; display: block; width: 12px; height: 12px; border-radius: 50%; background: var(--color-bg-track); }
.pips-edit button.on::before { background: var(--color-text-secondary); }
.pips-edit .lbl { margin-left: 4px; font-size: 13px; color: var(--color-text-secondary); }
.ed-actions { display: flex; align-items: center; gap: 8px; }
.btn.danger { color: var(--color-state-warning); padding: 0 8px; font-weight: 500; }
.btn.danger.armed { background: var(--color-state-warning); color: var(--color-text-onAccent); padding: 0 18px; }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { width: var(--control); height: var(--control); border-radius: 22px; box-shadow: inset 0 0 0 1px var(--color-bg-track); display: inline-grid; place-items: center; }
.toast.err { box-shadow: inset 0 0 0 1px var(--color-state-warning); }
.seg button[aria-checked="true"] { background: var(--color-bg-track); color: var(--color-text-primary); font-weight: 500; }
.s-hero .logo { position: absolute; left: 32px; top: 28px; color: var(--color-text-primary); line-height: 0; }
.s-hero .logo svg { height: 28px; width: auto; display: block; }

/* Revisão 2 (10/11): marcas no trilho, ícones, hero por marca, página do jogo.
   Figma: seção "Desktop · v3 · Revision 2". */
svg.i.fill { fill: currentColor; stroke: none; }
.navbtn .bmark { display: grid; place-items: center; color: var(--color-text-secondary); transition: color .16s; }
.navbtn .bmark.nintendo svg.i { width: 32px; height: 32px; } /* a pílula com o nome precisa de mais largura para se reconhecer */
.navbtn:hover:not([aria-current]) .bmark { color: var(--b); }
.navbtn[aria-current="page"] .bmark { color: var(--color-accent); }
.stat .l, .s-hero .caption, .seg button, .field > span { display: inline-flex; align-items: center; gap: 6px; }
.stat .l svg.i, .s-hero .caption svg.i, .field > span svg.i, .gw-sheet dt svg.i { width: 14px; height: 14px; }
.seg button svg.i { width: 16px; height: 16px; }
.table-title, .systems .title-line { align-items: center; }
.table-title .ico, .title-line .ico { color: var(--color-text-primary); }
.row { cursor: pointer; }
.edit-ico { border-radius: 6px; }
.edit-ico:hover { color: var(--color-text-primary); }

/* Página do jogo: janela sobre a página */
body.gw-open { overflow: hidden; }
.gw-scrim { position: fixed; inset: 0; background: var(--color-bg-scrim); z-index: 12; }
.gw { position: fixed; z-index: 13; top: 48px; left: 50%; transform: translateX(-50%); width: min(960px, calc(100vw - 32px)); max-height: calc(100vh - 96px); overflow-y: auto; background: var(--color-bg-panel); border-radius: var(--radius-panel); box-shadow: 0 24px 80px rgba(0, 0, 0, .5); scrollbar-width: thin; scrollbar-color: var(--color-bg-track) transparent; }
.gw-hero { position: relative; height: 280px; overflow: hidden; border-radius: var(--radius-panel) var(--radius-panel) 0 0; background: var(--color-bg-surface); }
.gw-hero.noart { height: 96px; }
.gw-hero .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.gw-hero .veil { position: absolute; inset: 0; background: linear-gradient(rgba(0, 0, 0, .45), rgba(0, 0, 0, 0) 120px), linear-gradient(rgba(39, 38, 38, 0) 120px, var(--color-bg-panel)); }
.gw-hero.noart .veil { display: none; }
.gw-logo { position: absolute; left: 32px; top: 28px; max-width: 220px; max-height: 64px; object-fit: contain; object-position: left top; }
.gw-x { position: absolute; right: 24px; top: 24px; width: var(--control); height: var(--control); border-radius: 22px; background: rgba(0, 0, 0, .45); display: grid; place-items: center; }
.gw-x:hover { background: rgba(0, 0, 0, .7); }
.gw-head { position: relative; display: flex; align-items: flex-start; gap: 16px; min-height: 76px; padding: 4px 32px 0 188px; }
.gw-head.nocover { padding-left: 32px; padding-top: 20px; min-height: 0; }
.gw-cover { position: absolute; left: 32px; top: -76px; width: 132px; height: 152px; display: flex; align-items: flex-end; }
.gw-cover img { max-width: 100%; max-height: 100%; border-radius: var(--radius-chip); box-shadow: 0 8px 24px rgba(0, 0, 0, .45); display: block; }
.gw-titles { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.gw-body { padding: 24px 32px 32px; display: flex; flex-direction: column; gap: 32px; }
.gw-sheet { margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--color-bg-track); }
.gw-sheet .f { padding: 16px 16px 16px 0; border-bottom: 1px solid var(--color-bg-track); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.gw-sheet dt { display: inline-flex; align-items: center; gap: 6px; font: 400 12px/16px var(--font-num); color: var(--color-text-tertiary); }
.gw-sheet dd { margin: 0; min-height: 24px; display: flex; align-items: center; font-size: 15px; line-height: 20px; min-width: 0; }
.gw-sheet dd .tag { color: var(--color-text-primary); }
.pips.lg { gap: 5px; }
.pips.lg i { width: 8px; height: 8px; }
.gw-sec { display: flex; flex-direction: column; gap: 16px; }
.gw-sec .title-line { gap: 8px; }
.gw-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.th { position: relative; aspect-ratio: 16 / 9; border-radius: var(--radius-control); overflow: hidden; background: var(--color-bg-surface); }
.th img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s var(--ease); }
.th:hover img { transform: scale(1.04); }
.th:focus-visible, .gw-x:focus-visible, .lb-btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.th .more { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0, 0, 0, .6); font: 500 16px/20px var(--font-text); }
.gw-none { margin: 0; padding: 24px; border-radius: var(--radius-control); background: var(--color-bg-surface); color: var(--color-text-tertiary); text-align: center; }

/* Galeria em tela cheia */
.lb { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .92); display: grid; place-items: center; }
.lb img { max-width: calc(100vw - 160px); max-height: calc(100vh - 96px); object-fit: contain; border-radius: var(--radius-control); }
.lb-btn { position: absolute; width: var(--control); height: var(--control); border-radius: 22px; background: var(--color-bg-surface); display: grid; place-items: center; }
.lb-btn:hover { background: var(--color-bg-knob); }
.lb-btn.x { right: 24px; top: 24px; }
.lb-btn.prev { left: 24px; top: 50%; transform: translateY(-50%); }
.lb-btn.next { right: 24px; top: 50%; transform: translateY(-50%); }
.lb-count { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font: 400 12px/16px var(--font-num); color: var(--color-text-secondary); }

<script>
// Studio Design System: campo de pontos do fundo, comum a todas as páginas do Studio.
// O pattern da Bova (ponto de 2 px em grade de 16) acende como luz em volta do ponteiro.
// A cor da luz é --dot-light (cada página põe a do seu acento; o hub usa branco).
// window.dotLight(hex) troca a cor na hora; window.dotLight(null) volta à da página.
// Sem ponteiro, a luz descansa no canto de baixo à direita. prefers-reduced-motion: a luz fica parada.

(() => {
  const cv = document.getElementById('dots');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const css = getComputedStyle(document.documentElement);
  const DEFAULT = (css.getPropertyValue('--dot-light') || '#FFFFFF').trim();
  const BASE = (css.getPropertyValue('--color-dot-base') || '#2A2929').trim();
  const toRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  let rgb = toRgb(DEFAULT);
  const GRID = 16;
  const RADIUS = 220;
  const BASE_ALPHA = 0.07;
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 0; let H = 0; let dpr = 1;
  const rest = () => ({ x: W - 24, y: H * 0.6 });
  let target = null; let pos = null; let raf = 0;

  function size() {
    dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!target) target = rest();
    if (!pos) pos = { ...target };
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const r2 = RADIUS * RADIUS;
    for (let y = GRID / 2; y < H; y += GRID) {
      for (let x = GRID / 2; x < W; x += GRID) {
        const dx = x - pos.x; const dy = y - pos.y;
        const lv = Math.exp(-(dx * dx + dy * dy) / r2 * 2.2);
        const a = BASE_ALPHA + lv * 0.6;
        const rr = 1 + lv * 0.6;
        ctx.fillStyle = lv > 0.02 ? `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a.toFixed(3)})` : BASE;
        ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  // A luz segue o ponteiro com atraso (lerp), para ler como luz e não como cursor.
  function tick() {
    pos.x += (target.x - pos.x) * 0.14;
    pos.y += (target.y - pos.y) * 0.14;
    draw();
    raf = Math.hypot(target.x - pos.x, target.y - pos.y) > 0.5 ? requestAnimationFrame(tick) : 0;
  }
  function aim(x, y) {
    target = { x, y };
    if (!raf) raf = requestAnimationFrame(tick);
  }

  window.dotLight = (hex) => { rgb = toRgb(hex || DEFAULT); draw(); };

  addEventListener('resize', size);
  if (!still) {
    addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') aim(e.clientX, e.clientY); }, { passive: true });
    document.addEventListener('mouseleave', () => { const r = rest(); aim(r.x, r.y); });
  }
  size();
})();

</script>

    if (!view.length) {
      const st = STATUSES.find(([k]) => k === S.status)[1];
      em.innerHTML = `${S.q ? `Nenhum jogo com “${esc(S.q)}”${S.status !== 'all' ? ` em ${st}` : ''}.` : `Nenhum jogo em ${st}.`}<button type="button" class="btn ghost" id="clear">Limpar</button>`;
      em.hidden = false; tb.hidden = true;
      $('clear').onclick = () => { S.q = ''; S.status = 'all'; $('q').value = ''; render(true); };
    } else { em.hidden = true; tb.hidden = false; }
    paint();
  }
  const layer = document.createElement('div'); $('tbody').appendChild(layer);
  function paint() {
    const tb = $('tbody'); const top = tb.scrollTop; const h = tb.clientHeight || 600;
    const s = Math.max(0, Math.floor(top / 56) - 6); const e = Math.min(view.length, Math.ceil((top + h) / 56) + 6);
    let out = '';
    for (let i = s; i < e; i++) out += rowHtml(view[i], i);
    layer.innerHTML = out;
  }
  $('tbody').addEventListener('scroll', () => requestAnimationFrame(paint), { passive: true });
  addEventListener('resize', () => paint());

  function rowHtml(g, i) {
    const br = brandOf(g.platform); const beaten = g.status === 'Beaten';
    const sub = [g.dev, g.released ? g.released.slice(0, 4) : '', g.genre].filter(Boolean).join(' · ');
    const when = beaten ? ptDate(g.beaten, true) : g.status;
    const hrs = g.hours != null ? `${fmt(g.hours)} h` : '–';
    const meta = [S.kind === 'system' ? '' : g.platform, when, g.hours != null ? hrs : ''].filter(Boolean).join(' · ');
    const pips = [1, 2, 3, 4, 5].map((n) => `<i class="${g.score >= n ? 'on' : ''}"></i>`).join('');
    return `<div class="row cols ${beaten ? 'beaten' : ''}" style="top:${i * 56}px" data-row="${g.row}" role="row">
<div class="c-title"><div class="t">${esc(g.title)}</div><div class="sub">${esc(sub) || '&nbsp;'}</div><div class="meta">${S.kind === 'system' ? '' : `<span class="tag" style="--b:${BCOLOR[br]}"></span>`}<span>${esc(meta)}</span></div></div>
<div class="c-sys cell"><span class="tag" style="--b:${BCOLOR[br]}">${esc(g.platform)}</span></div>
<div class="c-status"><span class="chip ${esc(g.status.replace(/\s/g, '-'))}">${esc(g.status === 'Beaten' ? 'Zerado' : g.status)}</span></div>
<div class="c-beaten cell">${beaten ? ptDate(g.beaten, true) : '–'}</div>
<div class="c-score"><span class="pips" title="${g.score == null ? 'sem score' : `${g.score} de 5`}">${pips}</span></div>
<div class="c-hours cell r">${hrs}</div>
<div class="c-edit">${D.edit ? `<span class="ico edit-ico">${svg('pencil')}</span>` : ''}</div></div>`;
  }

  function renderTiles(G) {
    const box = $('systems'); if (S.kind !== 'brand') { box.hidden = true; return; } box.hidden = false;
    $('tiles').innerHTML = SYS.filter((s) => s.brand === S.brand).map((s) => {
      const g = G.filter((x) => x.platform === s.name); const b = g.filter((x) => x.status === 'Beaten').length; const w = WM[s.name];
      const art = w ? w.svg.replace('<svg ', `<svg width="${w.w}" height="${w.h}" `) : `<span class="t-headline">${esc(s.full)}</span>`;
      return `<a class="tile" href="#/sistema/${slug(s.name)}" aria-label="${esc(s.full)}"><span class="wm">${art}</span><span class="nums"><b>${b} de ${fmt(g.length)}</b><span class="c3">${s.year || ''}</span></span><span class="bar"><i style="width:${g.length ? b / g.length * 100 : 0}%"></i></span></a>`;
    }).join('');
  }

  function renderFooter() {
    const d = new Date(D.updated); const tz = { timeZone: 'America/Sao_Paulo' };
    const hm = d.toLocaleTimeString('pt-BR', { ...tz, hour: '2-digit', minute: '2-digit' });
    const dd = new Intl.DateTimeFormat('en-CA', { ...tz }).format(d);
    const when = dd === D.today ? `hoje às ${hm}` : `em ${ptDate(dd)} às ${hm}`;
    if (liveAt) { const lh = liveAt.toLocaleTimeString('pt-BR', { ...tz, hour: '2-digit', minute: '2-digit' }); $('updated').textContent = `Ao vivo: planilha lida às ${lh} · edições salvas na planilha`; return; }
    $('updated').textContent = `Atualizado ${when}${D.edit ? ' · edições salvas na planilha' : ''}`;
  }

  // ---------- edição (B8, R11 a R14) ----------
  const F = $('editor'); let editing = null; let st = { status: 'Wishlist', score: null };
  const todayIso = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' }).format(new Date());
  F.platform.innerHTML = SYS.map((s) => `<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('');
  function paintStatus() { $('ed-status').innerHTML = ['Beaten', 'Wishlist', 'Backlog'].map((s) => `<button type="button" role="radio" data-v="${s}" aria-checked="${st.status === s}">${s}</button>`).join(''); }
  function paintScore() { $('ed-score').innerHTML = [1, 2, 3, 4, 5].map((n) => `<button type="button" role="radio" aria-label="${n} de 5" aria-checked="${st.score === n}" data-n="${n}" class="${st.score >= n ? 'on' : ''}"></button>`).join('') + `<span class="lbl">${st.score ? `${st.score} de 5` : 'sem score'}</span>`; }
  $('ed-status').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; st.status = b.dataset.v; if (st.status === 'Beaten' && !F.beaten.value) F.beaten.value = todayIso(); paintStatus(); });
  $('ed-score').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; const n = +b.dataset.n; st.score = st.score === n ? null : n; paintScore(); });
  function open(row) {
    if (!D.edit) return; const g = games.find((x) => x.row === row); if (!g) return; editing = g;
    F.title.value = g.title; F.platform.value = g.platform; F.released.value = g.released || ''; F.beaten.value = g.beaten || '';
    F.hours.value = g.hours ?? ''; F.developer.value = g.dev || ''; F.genre.value = g.genre || '';
    st = { status: ['Beaten', 'Wishlist', 'Backlog'].includes(g.status) ? g.status : 'Backlog', score: g.score };
    const br = brandOf(g.platform); $('ed-tag').style.setProperty('--b', BCOLOR[br]); $('ed-tag').textContent = `${g.platform} · ${br}`; $('ed-row').textContent = `linha ${g.row} da planilha`;
    paintStatus(); paintScore(); $('scrim').hidden = false; F.hidden = false; F.title.focus();
  }
  function close() { F.hidden = true; $('scrim').hidden = true; editing = null; $('ed-save').disabled = false; $('ed-save').textContent = 'Salvar'; disarm(); }

  // Apagar: dois cliques (o primeiro arma por 4 s). A linha sai da aba Backlog; volta pelo histórico da planilha.
  const delBtn = $('ed-delete'); let armT = 0;
  function disarm() { delBtn.classList.remove('armed'); delBtn.textContent = 'Apagar jogo'; clearTimeout(armT); }
  delBtn.addEventListener('click', async () => {
    if (!editing) return;
    if (!delBtn.classList.contains('armed')) { delBtn.classList.add('armed'); delBtn.textContent = 'Confirmar exclusão'; armT = setTimeout(disarm, 4000); return; }
    const g = games.find((x) => x.row === editing.row && x.title === editing.title) || editing;
    const idx = games.indexOf(g); const key = { title: g.title, platform: g.platform }; const row = g.row;
    if (idx >= 0) games.splice(idx, 1);
    render(false); close(); toast(`Apagando ${g.title} da planilha…`);
    try {
      const r = await fetch(D.edit.url, { method: 'POST', headers: { 'content-type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: D.edit.token, action: 'delete', row, key }) });
      const j = await r.json().catch(() => ({ ok: false, error: `resposta ${r.status}` }));
      if (!j.ok) throw new Error(j.error || 'erro desconhecido');
      for (const x of games) if (x.row > (j.row || row)) x.row -= 1; // as linhas de baixo sobem uma
      const pend = readPending(); pend.push({ row, key, deleted: true, at: Date.now() }); writePending(pend);
      toast(`${g.title} apagado da planilha.`);
    } catch (err) {
      if (idx >= 0) games.splice(idx, 0, g); render(false);
      toast(`Não apaguei: ${err.message === 'Failed to fetch' ? 'sem conexão com a planilha' : err.message}`, true);
    }
  });
  $('tbody').addEventListener('click', (e) => {
    const r = e.target.closest('.row'); if (!r) return; const row = +r.dataset.row;
    if (e.target.closest('.edit-ico')) { open(row); return; }
    const g = games.find((x) => x.row === row); if (g) openGame(g, true);
  });
  $('ed-close').onclick = close; $('ed-cancel').onclick = close; $('scrim').onclick = close;
  addEventListener('keydown', (e) => {
    if (LB) { if (e.key === 'Escape') closeLb(); else if (e.key === 'ArrowLeft') stepLb(-1); else if (e.key === 'ArrowRight') stepLb(1); return; }
    if (e.key !== 'Escape') return;
    if (!F.hidden) close(); else if (GW) closeGame();
  });
  let toastT = 0;
  function toast(msg, err) { const t = $('toast'); t.textContent = msg; t.classList.toggle('err', !!err); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, err ? 7000 : 3500); }
  F.addEventListener('submit', async (e) => {
    e.preventDefault(); if (!editing) return;
    const title = F.title.value.trim(); if (!title) { F.title.focus(); return; }
    const values = { title, platform: F.platform.value, status: st.status, genre: F.genre.value.trim(), released: F.released.value, beaten: st.status === 'Beaten' ? F.beaten.value : (F.beaten.value || ''), score: st.score, hours: F.hours.value === '' ? null : Math.max(0, Math.round(+F.hours.value)), dev: F.developer.value.trim() };
    // Se os dados ao vivo chegaram com o painel aberto, o jogo certo é o da lista nova (mesma linha).
    const g = games.find((x) => x.row === editing.row && x.title === editing.title) || editing; const before = { ...g }; const key = { title: g.title, platform: g.platform };
    $('ed-save').disabled = true; $('ed-save').textContent = 'Salvando…';
    Object.assign(g, values); render(false); close(); toast('Salvando na planilha…');
    try {
      const r = await fetch(D.edit.url, { method: 'POST', headers: { 'content-type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ token: D.edit.token, row: g.row, key, values: (({ dev, ...v }) => ({ ...v, developer: dev }))(values) }) });
      const j = await r.json().catch(() => ({ ok: false, error: `resposta ${r.status}` }));
      if (!j.ok) throw new Error(j.error || 'erro desconhecido');
      if (j.row) g.row = j.row;
      const pend = readPending().filter((p) => p.row !== g.row); pend.push({ row: g.row, key, values, at: Date.now() }); writePending(pend);
      toast('Salvo na planilha. A página publicada se atualiza em 1 a 2 minutos.');
    } catch (err) {
      Object.assign(g, before); render(false);
      toast(`Não salvei: ${err.message === 'Failed to fetch' ? 'sem conexão com a planilha' : err.message}`, true);
    }
  });


  // ---------- página do jogo (A2 da Revisão 2) ----------
  // Janela sobre a página, com endereço próprio (#/jogo/<título>/<sistema>): Voltar fecha, o link abre direto.
  let GW = null; let LB = null;
  const scopeHash = () => (S.kind === 'system' ? `#/sistema/${slug(S.system)}` : S.kind === 'brand' ? `#/marca/${slug(S.brand)}` : '#/');
  function openGame(g, push) {
    GW = g; if (push) history.pushState({ gw: 1 }, '', `#/jogo/${slug(g.title)}/${slug(g.platform)}`);
    renderGame(); $('gw-scrim').hidden = false; $('gw').hidden = false; $('gw').scrollTop = 0; document.body.classList.add('gw-open');
    document.title = `${g.title} · RetroOS`;
  }
  function closeGame(silent) {
    if (!GW) return; GW = null; closeLb();
    $('gw').hidden = true; $('gw-scrim').hidden = true; document.body.classList.remove('gw-open');
    document.title = S.kind === 'all' ? 'RetroOS · Backlog' : `${$('title').textContent} · RetroOS`;
    if (silent) return;
    if (history.state && history.state.gw) history.back(); else history.replaceState(null, '', scopeHash());
  }
  const shotsOf = (g) => Array.from({ length: artOf(g).s || 0 }, (_, i) => `${ART}g/${akey(g)}/s${i + 1}.webp`);
  const capsOf = (g) => (PB[slug(g.title)] || []).map((f) => `${ROOT}assets/photobook/${slug(g.title)}/${f}`);
  function gallery(id, title, suffix, ic, list) {
    if (!list.length) return '';
    const more = list.length - 4;
    const th = list.slice(0, 4).map((src, i) => `<button type="button" class="th" data-g="${id}" data-i="${i}" aria-label="Abrir imagem ${i + 1} de ${list.length}"><img src="${esc(src)}" alt="" loading="lazy">${i === 3 && more > 0 ? `<span class="more">+${more}</span>` : ''}</button>`).join('');
    return `<section class="gw-sec"><div class="title-line"><span class="ico">${svg(ic)}</span><h3 class="t-headline">${title}</h3><span class="t-headline c-4">${esc(suffix)}</span></div><div class="gw-grid">${th}</div></section>`;
  }
  function renderGame() {
    const g = GW; if (!g) return; const a = artOf(g); const base = `${ART}g/${akey(g)}/`;
    const br = brandOf(g.platform); const sys = SYSBY[g.platform] || { full: g.platform }; const beaten = g.status === 'Beaten';
    const sub = [g.dev, g.released ? g.released.slice(0, 4) : '', g.genre].filter(Boolean).join(' · ');
    const pips = g.score == null ? '–' : `<span class="pips lg" title="${g.score} de 5">${[1, 2, 3, 4, 5].map((n) => `<i class="${g.score >= n ? 'on' : ''}"></i>`).join('')}</span>`;
    const fields = [
      ['Sistema', `<span class="tag" style="--b:${BCOLOR[br]}">${esc(sys.full)}</span>`],
      ['Status', `<span class="chip ${esc(g.status.replace(/\s/g, '-'))}">${esc(beaten ? 'Zerado' : g.status)}</span>`],
      ['Zerado em', beaten ? ptDate(g.beaten, true) : '–'],
      ['Score', pips],
      ['Horas', g.hours != null ? `${fmt(g.hours)} h` : '–'],
      ['Lançamento', ptDate(g.released)],
      ['Developer', esc(g.dev) || '–'],
      ['Gênero', esc(g.genre) || '–'],
    ];
    const caps = capsOf(g); const shots = shotsOf(g);
    $('gw').innerHTML = `<div class="gw-hero ${a.h ? '' : 'noart'}">${a.h ? `<img class="bg" src="${base}h.webp" alt="">` : ''}<span class="veil"></span>
${a.l ? `<img class="gw-logo" src="${base}l.webp" alt="">` : ''}<button type="button" class="gw-x" id="gw-x" aria-label="Fechar">${svg('x')}</button></div>
<div class="gw-head ${a.c ? '' : 'nocover'}">${a.c ? `<span class="gw-cover"><img src="${base}c.webp" alt=""></span>` : ''}
<div class="gw-titles"><h2 class="t-title" id="gw-title">${esc(g.title)}</h2><p class="t-callout c-2">${esc(sub) || '&nbsp;'}</p></div>
${D.edit ? `<button type="button" class="btn ghost" id="gw-edit">${svg('pencil')}Editar</button>` : ''}</div>
<div class="gw-body"><dl class="gw-sheet">${fields.map(([l, v]) => `<div class="f"><dt>${svg(FIELD_ICON[l])}${l}</dt><dd>${v}</dd></div>`).join('')}</dl>
${gallery('caps', 'Minhas capturas', `${caps.length} ${caps.length === 1 ? 'foto' : 'fotos'}`, 'camera', caps)}${gallery('shots', 'Screenshots', sys.full, 'image', shots)}
${!a.h && !caps.length && !shots.length ? '<p class="gw-none">Sem arte no RetroOS para este jogo.</p>' : ''}</div>`;
  }
  $('gw').addEventListener('click', (e) => {
    if (e.target.closest('#gw-x')) { closeGame(); return; }
    if (e.target.closest('#gw-edit')) { const row = GW.row; closeGame(); open(row); return; }
    const th = e.target.closest('.th'); if (th && GW) openLb(th.dataset.g === 'caps' ? capsOf(GW) : shotsOf(GW), +th.dataset.i);
  });
  $('gw-scrim').onclick = () => closeGame();
  // Galeria em tela cheia: setas, contador e Esc.
  function openLb(list, i) { LB = { list, i }; paintLb(); $('lb').hidden = false; }
  function closeLb() { if (!LB) return; LB = null; $('lb').hidden = true; $('lb').innerHTML = ''; }
  function stepLb(d) { if (!LB) return; LB.i = (LB.i + d + LB.list.length) % LB.list.length; paintLb(); }
  function paintLb() {
    const n = LB.list.length;
    $('lb').innerHTML = `<img src="${esc(LB.list[LB.i])}" alt=""><button type="button" class="lb-btn x" data-a="x" aria-label="Fechar">${svg('x')}</button>${n > 1 ? `<button type="button" class="lb-btn prev" data-a="p" aria-label="Anterior">${svg('left')}</button><button type="button" class="lb-btn next" data-a="n" aria-label="Próxima">${svg('right')}</button>` : ''}<span class="lb-count">${LB.i + 1} / ${n}</span>`;
  }
  $('lb').addEventListener('click', (e) => { const b = e.target.closest('[data-a]'); if (b && b.dataset.a === 'p') stepLb(-1); else if (b && b.dataset.a === 'n') stepLb(1); else if (b || e.target === $('lb')) closeLb(); });

  addEventListener('hashchange', route);
  route();

  // Leitura ao vivo: a página abre com a foto do build e troca pelos jogos da planilha quando chegam.
  // Mesmo endereço secreto da edição (só existe dentro da página cifrada). Falhou: fica a foto.
  async function live() {
    if (!D.edit || window.self !== window.top) return;
    try {
      const r = await fetch(D.edit.url, { cache: 'no-store' }); const j = await r.json();
      if (!j.ok || !Array.isArray(j.games) || !j.games.length) throw new Error(j.error || 'resposta vazia');
      games = j.games.map(toObj); liveAt = new Date(j.updated || Date.now());
      writePending([]); // a planilha lida agora já traz tudo o que foi salvo
      const top = $('tbody').scrollTop; render(false); $('tbody').scrollTop = top; paint();
    } catch (err) { console.warn('retroos: leitura ao vivo falhou, fica a foto do build:', err.message); }
  }
  live();
})();

</script>
</body>
</html>
