/* Studio Design System · tokens comuns a todas as páginas do Studio (hub, Finances, Backlog e as próximas).
   Fonte: vault Bova/Studio Hub/Studio Design System.md e o Figma "Studio · Hub" (coleção Semantic).
   Cada página declara só o seu acento (--color-accent, --color-bg-navActive, --dot-light). Valor solto é defeito. */
:root {
  color-scheme: dark;
  /* cor */
  --color-bg-app: #1B1A1A;
  --color-bg-panel: #272626;
  --color-bg-surface: #303030;
  --color-bg-chip: #353535;
  --color-bg-track: #3A3A3A;
  --color-bg-knob: #464646;
  --color-bg-scrim: rgba(0, 0, 0, .6);
  --color-border-default: #2F3030;
  --color-text-primary: #FFFFFF;
  --color-text-secondary: #A6ABB3;
  --color-text-tertiary: #888A96;
  --color-text-faint: #5B5B5B;
  --color-text-onAccent: #000000;
  --color-state-positive: #66CD7D;
  --color-state-negative: #FFA8AD;
  --color-state-warning: #FF9230;
  --color-dot-base: #2A2929;
  /* acento por tema (regra T5): Money, Play, Work */
  --color-theme-money: #66CD7D;
  --color-theme-play: #F3D27A;
  --color-theme-work: #FF2F00;
  /* tipo */
  --font-text: "Geist", ui-sans-serif, system-ui, sans-serif;
  --font-num: "Geist Mono", ui-monospace, monospace;
  /* forma */
  --radius-panel: 24px;
  --radius-card: 24px;
  --radius-control: 12px;
  --radius-chip: 8px;
  --radius-pill: 999px;
  --control: 44px;
  /* página: conteúdo de 1280 centrado, margem de 80 (a largura do hub, padrão de todas as páginas) */
  --page-max: 1280px;
  --page-margin: 80px;
  --ease: cubic-bezier(.2, .7, .2, 1);
}

/* Escala de tipo (Studio Design System, Tipografia) */
.t-display { font: 300 44px/48px var(--font-text); letter-spacing: -0.02em; }
.t-number { font: 300 32px/36px var(--font-text); letter-spacing: -0.02em; }
.t-title { font: 500 22px/28px var(--font-text); }
.t-headline { font: 500 16px/20px var(--font-text); }
.t-body { font: 400 15px/20px var(--font-text); }
.t-callout { font: 400 13px/16px var(--font-text); }
.t-label { font: 400 12px/16px var(--font-num); }
.t-caption { font: 400 11px/14px var(--font-text); }
.c-2 { color: var(--color-text-secondary); }
.c-3 { color: var(--color-text-tertiary); }
.c-4 { color: var(--color-text-faint); }

<style>
/* Studio. · tokens com os nomes do Figma (Studio · Hub, coleção Semantic). Valor solto aqui é defeito. */
:root {
  /* Hub: só o que é da página. Cor, tipo e forma vêm de _base/studio/tokens.css (Studio Design System). */
  --color-project-finances: var(--color-theme-money);
  --color-project-backlog: var(--color-theme-play);
  --color-project-studio: var(--color-theme-work);
  --dot-light: #FFFFFF;
  --color-bg-hover: var(--color-bg-chip);
  --font-sans: var(--font-text);
  --font-mono: var(--font-num);
  --space-sm: 8px;
  --space-card: 24px;
  --space-section: 48px;
  --space-gutter: 24px;
  --space-margin: 80px;
  --radius-well: var(--radius-control);
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--color-bg-app); color: var(--color-text-primary); }
body { font: 400 15px/20px var(--font-sans); -webkit-font-smoothing: antialiased; min-height: 100vh; }
.mono { font-family: var(--font-mono); }

#dots { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

.page { position: relative; z-index: 1; max-width: calc(var(--page-max) + 2 * var(--page-margin)); margin: 0 auto; padding: var(--space-section) var(--page-margin) 96px; }

/* Hero: pintura do acervo do TV Gallery, logo e legenda. 1280 x 320, raio 24. */
.hero { position: relative; height: 320px; border-radius: var(--radius-card); overflow: hidden; background: var(--color-bg-panel); }
.hero .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .6s var(--ease); }
.hero .art.on { opacity: 1; }
.scrim { position: absolute; left: 0; right: 0; pointer-events: none; }
.scrim.top { top: 0; height: 140px; background: linear-gradient(rgba(0, 0, 0, .45), rgba(0, 0, 0, 0)); }
.scrim.bottom { bottom: 0; height: 120px; background: linear-gradient(rgba(0, 0, 0, 0), rgba(0, 0, 0, .5)); }
.logo { position: absolute; top: 32px; left: 30px; margin: 0; line-height: 0; color: var(--color-text-primary); }
.logo svg { display: block; width: 130px; height: auto; }
.caption { position: absolute; right: 32px; bottom: 32px; margin: 0; font-size: 12px; line-height: 16px; color: rgba(255, 255, 255, .8); }

/* Avatar: desenho do Bova, morde a borda de baixo do hero. */
.owner { display: flex; align-items: flex-start; gap: var(--space-card); padding-left: 32px; margin-top: -56px; position: relative; }
.avatar { width: 112px; height: 112px; border-radius: 50%; box-shadow: 0 0 0 6px var(--color-bg-app); background: var(--color-bg-app); }
.owner-name { font: 500 20px/24px var(--font-sans); margin-top: 72px; }

/* Avatar animado: 15 poses num SVG so; o script acende uma (.on) e liga as expressoes por classe. */
svg.avatar { display: block; flex: none; overflow: hidden; }
.avatar .p, .avatar .lid, .avatar .grin, .avatar .oh { display: none; }
.avatar .p.on { display: inline; }
.avatar .lid { fill: none; stroke: #000; stroke-width: 18; stroke-linecap: round; }
.avatar .eye, .avatar .brow, .avatar .grin, .avatar .oh { transform-box: fill-box; transform-origin: center; }
.avatar .eye { transition: transform 70ms ease-in; }
.avatar .brow { transition: transform 140ms cubic-bezier(.34, 1.56, .64, 1); }
.avatar.blink .eye { transform: scaleY(.15); }
.avatar.shut .on .eye { display: none; }
.avatar.shut .on .lid { display: inline; }
.avatar.smile:not(.wow) .on .mouth, .avatar.wow .on .mouth { display: none; }
.avatar.smile:not(.wow) .on .grin { display: inline; animation: avatar-pop 200ms cubic-bezier(.34, 1.56, .64, 1); }
.avatar.wow .on .oh { display: inline; animation: avatar-pop 160ms cubic-bezier(.34, 1.56, .64, 1); }
.avatar.wow .eye { transform: scale(1.22); transition: transform 140ms cubic-bezier(.34, 1.56, .64, 1); }
.avatar.wow .brow { transform: translateY(-20px); }
@keyframes avatar-pop { from { transform: scale(.5); } }

/* Quadro: um tema por coluna, quatro por fileira. */
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: var(--space-gutter); row-gap: var(--space-section); margin-top: 48px; }
.theme { display: flex; flex-direction: column; gap: 12px; }
.theme-head { display: flex; align-items: center; gap: var(--space-sm); height: 29px; padding-bottom: 12px; border-bottom: 1px solid var(--color-border-default); margin-bottom: 4px; font: 400 12px/16px var(--font-mono); color: var(--color-text-tertiary); }
.theme-head .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.theme-head .num { color: var(--color-text-faint); }

/* Bloco de projeto: 302 x 140, raio 24. A cor é do tema (--c).
   A borda de 1 px fica dentro da caixa, então os recuos internos são 19 (20 no Figma, menos a borda). */
.tile { position: relative; display: block; height: 140px; padding: 19px; border-radius: var(--radius-card); background: var(--color-bg-panel); border: 1px solid transparent; color: inherit; text-decoration: none; outline: none; transition: background-color .16s var(--ease), border-color .16s var(--ease); }
.tile .well { display: grid; place-items: center; width: 40px; height: 40px; border-radius: var(--radius-well); background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); }
.tile .well svg { width: 24px; height: 24px; }
.tile .name { position: absolute; left: 19px; top: 79px; font: 500 16px/20px var(--font-sans); }
.tile .line { position: absolute; left: 19px; top: 103px; font-size: 13px; line-height: 16px; color: var(--color-text-tertiary); }
.tile .arrow { position: absolute; right: 19px; top: 19px; width: 20px; height: 20px; color: var(--color-text-faint); transition: color .16s var(--ease); }
.tile:hover { background: var(--color-bg-hover); border-color: color-mix(in srgb, var(--c) 50%, transparent); }
.tile:hover .arrow, .tile:focus-visible .arrow { color: var(--color-text-primary); }
.tile:focus-visible { box-shadow: 0 0 0 2px var(--c); }

.tile.soon { background: transparent; border: 1px dashed var(--color-border-default); cursor: default; }
.tile.soon .well { background: var(--color-bg-panel); color: var(--color-text-faint); }
.tile.soon .name, .tile.soon .line { color: var(--color-text-faint); }
.tile.soon .chip { position: absolute; right: 19px; top: 27px; padding: 4px 8px; border: 1px solid var(--color-border-default); border-radius: 6px; font: 400 11px/12px var(--font-mono); color: var(--color-text-faint); }

/* Entrada: a pintura com fade, depois os temas em sequência (60 ms, 8 px). */
/* O estado final é o normal da página: se a animação não rodar, o quadro aparece igual. */
.theme { animation: rise .5s var(--ease) both; animation-delay: calc(200ms + var(--i) * 60ms); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) {
  .theme { animation-name: fade; }
  @keyframes fade { from { opacity: 0; } }
}

</style>

<script>
// Studio Design System: campo de pontos do fundo, comum a todas as páginas do Studio.
// O pattern da Bova (ponto de 2 px em grade de 16) acende como luz em volta do ponteiro.
// A cor da luz é --dot-light (cada página põe a do seu acento; o hub usa branco).
// window.dotLight(hex) troca a cor na hora; window.dotLight(null) volta à da página.
// Sem ponteiro, a luz descansa no canto de baixo à direita. prefers-reduced-motion: a luz fica parada.

(() => {
  const cv = document.getElementById('dots');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const css = getComputedStyle(document.documentElement);
  const DEFAULT = (css.getPropertyValue('--dot-light') || '#FFFFFF').trim();
  const BASE = (css.getPropertyValue('--color-dot-base') || '#2A2929').trim();
  const toRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  let rgb = toRgb(DEFAULT);
  const GRID = 16;
  const RADIUS = 220;
  const BASE_ALPHA = 0.07;
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 0; let H = 0; let dpr = 1;
  const rest = () => ({ x: W - 24, y: H * 0.6 });
  let target = null; let pos = null; let raf = 0;

  function size() {
    dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!target) target = rest();
    if (!pos) pos = { ...target };
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const r2 = RADIUS * RADIUS;
    for (let y = GRID / 2; y < H; y += GRID) {
      for (let x = GRID / 2; x < W; x += GRID) {
        const dx = x - pos.x; const dy = y - pos.y;
        const lv = Math.exp(-(dx * dx + dy * dy) / r2 * 2.2);
        const a = BASE_ALPHA + lv * 0.6;
        const rr = 1 + lv * 0.6;
        ctx.fillStyle = lv > 0.02 ? `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a.toFixed(3)})` : BASE;
        ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  // A luz segue o ponteiro com atraso (lerp), para ler como luz e não como cursor.
  function tick() {
    pos.x += (target.x - pos.x) * 0.14;
    pos.y += (target.y - pos.y) * 0.14;
    draw();
    raf = Math.hypot(target.x - pos.x, target.y - pos.y) > 0.5 ? requestAnimationFrame(tick) : 0;
  }
  function aim(x, y) {
    target = { x, y };
    if (!raf) raf = requestAnimationFrame(tick);
  }

  window.dotLight = (hex) => { rgb = toRgb(hex || DEFAULT); draw(); };

  addEventListener('resize', size);
  if (!still) {
    addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') aim(e.clientX, e.clientY); }, { passive: true });
    document.addEventListener('mouseleave', () => { const r = rest(); aim(r.x, r.y); });
  }
  size();
})();

</script>

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Hero
$('logo').innerHTML = LOGO;
const [slug, caption] = ART[Math.floor(Math.random() * ART.length)];
const art = $('art');
art.addEventListener('load', () => art.classList.add('on'), { once: true });
art.src = `assets/art/${slug}.jpg`;
$('caption').textContent = caption;

// Quadro: um tema por coluna. Teclas 1 a 9 nos nove primeiros projetos vivos (T7).
const live = [];
$('board').innerHTML = THEMES.map((t, i) => `<section class="theme" style="--c:${t.color};--i:${i}" aria-label="${esc(t.name)}">
  <header class="theme-head"><span class="dot"></span><span class="num">${t.num}</span><span>${esc(t.name)}</span></header>
  ${t.projects.map((p) => {
    const body = `<span class="well">${ICON[p.icon] || ''}</span><span class="name">${esc(p.name)}</span><span class="line">${esc(p.line)}</span>`;
    if (!p.href) return `<div class="tile soon" aria-disabled="true">${body}<span class="chip">em preparo</span></div>`;
    live.push(p.href);
    const key = live.length <= 9 ? live.length : null;
    return `<a class="tile" href="${p.href}" data-hex="${t.hex}"${key ? ` aria-keyshortcuts="${key}"` : ''}>${body}<span class="arrow">${ICON.arrow}</span></a>`;
  }).join('')}
</section>`).join('');

// A luz dos pontos toma a cor do tema sob o mouse (H3).
for (const a of document.querySelectorAll('a.tile')) {
  a.addEventListener('mouseenter', () => window.dotLight && window.dotLight(a.dataset.hex));
  a.addEventListener('mouseleave', () => window.dotLight && window.dotLight(null));
}

addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
  const n = Number(e.key);
  if (n >= 1 && n <= 9 && live[n - 1]) location.href = live[n - 1];
});

// Avatar animado: a cabeca vira para o ponteiro (15 poses), pisca sozinha, sorri sobre um projeto
// e se surpreende no clique. Sem o SVG, ou com movimento reduzido, fica o desenho parado de frente.
(async () => {
  const img = document.querySelector('img.avatar');
  if (!img) return;
  let svg;
  try {
    const res = await fetch('assets/avatar.svg');
    if (!res.ok) return;
    const doc = new DOMParser().parseFromString(await res.text(), 'image/svg+xml');
    svg = document.importNode(doc.documentElement, true);
  } catch { return; }
  if (svg.nodeName !== 'svg') return;
  svg.setAttribute('width', 112); svg.setAttribute('height', 112);
  const poses = {};
  for (const g of svg.querySelectorAll('.p')) poses[g.dataset.p] = g;
  let cur = null;
  const show = (name) => {
    if (name === cur || !poses[name]) return;
    if (cur) poses[cur].classList.remove('on');
    poses[name].classList.add('on'); cur = name;
  };
  show('A3');
  img.replaceWith(svg);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  // Piscada: achata, fecha no arco, abre. De vez em quando, dupla.
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const blink = async () => {
    if (svg.classList.contains('wow')) return;
    svg.classList.add('blink'); await wait(60);
    svg.classList.add('shut'); await wait(70);
    svg.classList.remove('shut'); svg.classList.remove('blink'); await wait(100);
  };
  (async function loop() {
    await wait(3000 + Math.random() * 3000);
    if (!document.hidden) { await blink(); if (Math.random() < 0.2) { await wait(80); await blink(); } }
    loop();
  })();

  // Expressoes nos projetos.
  let wowTimer;
  for (const a of document.querySelectorAll('a.tile')) {
    a.addEventListener('mouseenter', () => svg.classList.add('smile'));
    a.addEventListener('mouseleave', () => svg.classList.remove('smile'));
    a.addEventListener('pointerdown', () => {
      svg.classList.add('wow'); clearTimeout(wowTimer);
      wowTimer = setTimeout(() => svg.classList.remove('wow'), 600);
    });
  }
  addEventListener('pageshow', () => svg.classList.remove('wow', 'smile'));

  // Seguir o ponteiro: direcao decide a pose; perto do avatar, olha de frente. Com folga para nao tremer.
  if (!matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  const H = 0.06, COLS = [-0.6, -0.18, 0.18, 0.6], ROWS = [-0.35, 0.35];
  const level = (v, was, edges) => {
    let l = edges.findIndex((e) => v < e); if (l < 0) l = edges.length;
    if (l !== was) {
      const lo = was > 0 ? edges[was - 1] - H : -Infinity, hi = was < edges.length ? edges[was] + H : Infinity;
      if (v > lo && v < hi) return was;
    }
    return l;
  };
  let col = 2, row = 1, px = 0, py = 0, queued = false;
  const aim = () => {
    queued = false;
    const b = svg.getBoundingClientRect();
    const dx = px - (b.left + b.width / 2), dy = py - (b.top + b.height / 2);
    const d = Math.max(Math.hypot(dx, dy), 160);
    col = level(dx / d, col, COLS); row = level(dy / d, row, ROWS);
    show('BAC'[row] + (col + 1));
  };
  addEventListener('pointermove', (e) => {
    if (e.pointerType === 'touch') return;
    px = e.clientX; py = e.clientY;
    if (!queued) { queued = true; requestAnimationFrame(aim); }
  }, { passive: true });
  document.documentElement.addEventListener('mouseleave', () => { col = 2; row = 1; show('A3'); });
})();

</script>
