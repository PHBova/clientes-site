<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jornal TT · Edição 07 · Prévia</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<link rel="icon" type="image/svg+xml" href="../../studio/hub/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Jornal TT 07 · prévia folheável.
   Design system da Apple (lei 0 do Design TOTL), em aparência clara, com os números medidos no Xcode
   (Brain/Scripts/apple-metrics.swift, macOS 27.2.1): texto Body 13/16, Subheadline 11/14, Title 2 17/22;
   controle extraLarge de 36 de altura; cores do sistema em aqua. Geist no lugar da SF e Phosphor Regular
   no lugar dos SF Symbols, por licença. */
:root {
  color-scheme: light;
  --strips: 14;
  /* NSColor em aqua */
  --under-page: #F6F6F6;                 /* underPageBackgroundColor: o fundo atrás de uma página de documento */
  --label: rgba(0, 0, 0, .85);
  --label-2: rgba(0, 0, 0, .5);
  --label-3: rgba(0, 0, 0, .26);
  --separator: rgba(0, 0, 0, .1);
  --fill-3: rgba(0, 0, 0, .05);
  --fill-sel: rgba(0, 0, 0, .09);
  --focus: rgba(0, 122, 255, .5);
  --control: 36px;                       /* NSControl.ControlSize.extraLarge */
  --font: "Geist", -apple-system, system-ui, sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--under-page); color: var(--label);
  font: 400 13px/16px var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
h1, p { margin: 0; }

.window { height: 100vh; min-width: 1024px; display: flex; flex-direction: column; padding: 16px 20px 20px; gap: 8px; }
.titlebar { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px; height: var(--control); flex: none; }
.titlebar .badge { justify-self: end; }
/* selo de colaboração: as duas marcas na mesma altura óptica, separadas por um × discreto */
.collab { display: flex; align-items: center; gap: 12px; color: var(--label); }
.collab .logo { display: block; flex: none; }
.collab .bova { height: 17px; width: 86px; }   /* 760 x 150 */
.collab .tt { height: 26px; width: 66px; }     /* 497 x 195 */
.collab .x { font: 400 13px/16px var(--font); color: var(--label-2); }
.title { font: 600 17px/22px var(--font); letter-spacing: -.01em; }
.title span { color: var(--label-2); font-weight: 400; }
.badge { font: 400 11px/14px var(--font); color: var(--label-2); padding: 5px 10px; border-radius: 12px; background: var(--fill-3); }

/* palco: a área entre o título e a barra. A borda some em degradê, para o papel não ser cortado seco. */
.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab;
  -webkit-mask-image: linear-gradient(#0000, #000 14px, #000 calc(100% - 14px), #0000);
  mask-image: linear-gradient(#0000, #000 14px, #000 calc(100% - 14px), #0000); }
.stage.zoomed { cursor: move; }
.stage.dragging { cursor: grabbing; }
/* a cena fica centrada por margem, não por alinhamento: com zoom ela é maior que o palco e precisa transbordar igual para os dois lados */
.zoomer { position: absolute; inset: 0; transform-origin: 50% 50%; }
.scene { position: absolute; left: 50%; top: 50%; width: calc(var(--W) * 2); height: var(--H);
  margin: calc(var(--H) / -2) 0 0 calc(var(--W) * -1); perspective: var(--persp, 3400px); perspective-origin: 50% 42%; }
.book { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; opacity: 0; transition: opacity .5s var(--ease); }
.book.on { opacity: 1; }

/* sombra do jornal sobre a mesa, uma por lado */
.under { position: absolute; top: 0; width: var(--W); height: 100%; transform: translateZ(-2px); border-radius: 2px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .14), 0 10px 24px rgba(0, 0, 0, .12), 0 32px 72px rgba(0, 0, 0, .14); }
.under.l { left: 0; transform-origin: 100% 50%; } .under.r { left: var(--W); transform-origin: 0 50%; }

/* folha: uma corrente de tiras, cada uma girando um pouco sobre a anterior. É isso que curva o papel. */
.leaf { position: absolute; left: var(--W); top: 0; width: 0; height: 100%; transform-style: preserve-3d; }
.strip { position: absolute; top: 0; left: var(--w); width: calc(var(--w) + .7px); height: 100%;
  transform-origin: 0 50%; transform-style: preserve-3d; transform: rotateY(calc(var(--d) * -1deg));
  --t: calc(var(--a) + var(--k) * var(--d)); }
.leaf > .strip { left: 0; transform: rotateY(calc(var(--a) * -1deg)); }
.f { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background-color: #F8F7F3; background-repeat: no-repeat; background-size: var(--W) var(--H); }
.f.front { background-image: var(--front); background-position: calc(var(--k) * var(--w) * -1) 0; }
.f.back { background-image: var(--back); transform: rotateY(180deg);
  background-position: calc((var(--W) - (var(--k) + 1) * var(--w)) * -1) 0; }
/* luz: a tira escurece conforme vira de lado, e recebe a sombra da folha que passa por cima.
   O degradê vai do valor desta tira ao da próxima, para a curva não aparecer em degraus. */
.strip { --t2: calc(var(--t) + var(--d));
  --s1: calc(sin(var(--t) * 1deg) * sin(var(--t) * 1deg)); --s2: calc(sin(var(--t2) * 1deg) * sin(var(--t2) * 1deg));
  --c1: calc(1 - var(--k) / var(--strips) * .75); --c2: calc(1 - (var(--k) + 1) / var(--strips) * .75); }
.f::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
.f.front::after { background: linear-gradient(90deg, rgba(0, 0, 0, calc(var(--s1) * .42 + var(--cf, 0) * var(--c1))), rgba(0, 0, 0, calc(var(--s2) * .42 + var(--cf, 0) * var(--c2)))); }
.f.back::after { background: linear-gradient(270deg, rgba(0, 0, 0, calc(var(--s1) * .34 + var(--cb, 0) * var(--c1))), rgba(0, 0, 0, calc(var(--s2) * .34 + var(--cb, 0) * var(--c2)))); }
/* calha: o papel afunda perto da dobra */
.strip[style*="--k:0"] > .f::before, .strip[style*="--k:1;"] > .f::before { content: ""; position: absolute; inset: 0; pointer-events: none; }
.strip[style*="--k:0"] > .front::before { background: linear-gradient(90deg, rgba(0, 0, 0, .26), rgba(0, 0, 0, .09)); }
.strip[style*="--k:1;"] > .front::before { background: linear-gradient(90deg, rgba(0, 0, 0, .09), rgba(0, 0, 0, 0)); }
.strip[style*="--k:0"] > .back::before { background: linear-gradient(270deg, rgba(0, 0, 0, .26), rgba(0, 0, 0, .09)); }
.strip[style*="--k:1;"] > .back::before { background: linear-gradient(270deg, rgba(0, 0, 0, .09), rgba(0, 0, 0, 0)); }

/* barra de ferramentas: controles extraLarge (36) em cápsula de vidro, como a barra do macOS 27 */
.toolbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; height: var(--control); flex: none; }
.hint { font: 400 11px/14px var(--font); color: var(--label-2); }
.group { display: flex; align-items: center; gap: 8px; }
.group.end { justify-self: end; }
.glass { height: var(--control); border-radius: 18px; background: rgba(255, 255, 255, .78);
  -webkit-backdrop-filter: blur(20px) saturate(1.8); backdrop-filter: blur(20px) saturate(1.8);
  box-shadow: 0 0 0 .5px var(--separator), 0 1px 2px rgba(0, 0, 0, .06), 0 4px 12px rgba(0, 0, 0, .06); }
.icon { width: var(--control); display: grid; place-items: center; }
.glass svg { width: 15px; height: 15px; fill: currentColor; display: block; }
.icon:hover:not(:disabled) { background: #FFFFFF; }
.icon:active:not(:disabled) { background: rgba(236, 236, 236, .9); }
.seg { display: inline-flex; align-items: center; padding: 3px; gap: 1px; }
.seg button { height: 30px; min-width: 30px; padding: 0 12px; border-radius: 15px; display: grid; place-items: center; white-space: nowrap;
  font-variant-numeric: tabular-nums; transition: background .16s; }
.seg button:hover:not(:disabled):not([aria-pressed="true"]) { background: var(--fill-3); }
.seg button[aria-pressed="true"] { background: var(--fill-sel); font-weight: 600; }
.seg button:active:not(:disabled) { background: var(--fill-sel); }
.zoom button { padding: 0 9px; }
.zoom #zval { min-width: 52px; color: var(--label-2); }
button:disabled { color: var(--label-3); }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

</style>
</head>

7.993V177.769H109.149V148.598Z"/><path d="M184.191 140.125C182.859 134.019 177.9 130.33 170.879 130.33C164.342 130.33 159.136 134.274 157.926 140.125H184.191ZM137.226 147.146C137.226 128.746 151.147 115.555 170.515 115.555C192.543 115.555 206.707 131.409 203.922 153.562L157.926 153.441C158.894 159.13 164.342 163.125 171 163.125C177.049 163.125 181.165 161.427 185.159 157.314L200.533 166.151C195.328 173.169 185.038 178.979 171 178.979C150.058 178.979 137.226 165.576 137.226 147.146Z"/><path d="M237.928 100.302H258.749L258.625 158.888H284.288V177.768H237.928V100.302Z"/><path d="M291.665 116.765H311.639V177.768H291.665V116.765ZM289.247 96.5492C289.247 90.3755 294.695 86.1387 301.47 86.1387C308.128 86.1387 313.576 90.3755 313.576 96.5492C313.576 102.723 308.128 106.839 301.47 106.839C294.695 106.839 289.247 102.723 289.247 96.5492Z"/><path d="M338.509 140.124C338.509 144.845 341.656 148.598 346.983 148.598C352.43 148.598 355.577 144.845 355.577 140.124C355.577 136.13 352.551 132.014 346.983 132.014C341.656 132.014 338.509 135.888 338.509 140.124ZM374.216 139.882C374.216 152.848 364.858 163.672 348.758 164.412L342.988 177.647H369.737V194.712L314.904 194.837L330.869 160.226C323.721 155.78 319.746 148.282 319.746 139.882C319.746 126.809 330.035 115.309 347.104 115.309C348.126 115.309 349.125 115.352 350.096 115.433L357.756 96.791L376.637 103.933L366.718 122.37C371.58 126.906 374.216 133.187 374.216 139.882Z"/><path d="M426.383 148.598C426.383 139.277 422.993 134.314 415.609 134.314C407.62 134.314 403.141 138.914 403.141 146.298V177.769H383.17V95.2178H403.141V124.872C407.135 119.788 414.641 116.035 421.783 116.035C438.851 116.035 447.079 126.93 447.079 147.993V177.769H426.383V148.598Z"/><path d="M459.181 147.388V133.709H451.07V116.765H459.181V107.323L479.276 98.6074V116.765H496.704V133.709H479.276V147.388C479.276 156.951 481.212 162.035 496.704 160.22V178.374C470.133 181.521 459.181 171.558 459.181 147.388Z"/></svg>
    </p>
    <h1 class="title">Jornal TT <span>Edição 07</span></h1>
    <p class="badge">Prévia de layout · fotos e textos provisórios</p>
  </header>

  <section class="stage" id="stage" aria-label="Jornal TT, edição 07">
    <div class="zoomer" id="zoomer">
      <div class="scene">
        <div class="book" id="book"></div>
      </div>
    </div>
  </section>

  <footer class="toolbar">
    <p class="hint">Arraste a página para folhear. Role ou clique duas vezes para aproximar.</p>

    <div class="group">
      <button class="glass icon" id="prev" aria-label="Página anterior"><svg viewBox="0 0 256 256"><path d="M165.66 202.34a8 8 0 0 1-11.32 11.32l-80-80a8 8 0 0 1 0-11.32l80-80a8 8 0 0 1 11.32 11.32L91.31 128Z"/></svg></button>
      <div class="glass seg" id="seg" role="group" aria-label="Ir para a página">
        <button data-go="0">Capa</button>
        <button data-go="1">2 · 3</button>
        <button data-go="2">4 · 5</button>
        <button data-go="3">6 · 7</button>
        <button data-go="4">Contracapa</button>
      </div>
      <button class="glass icon" id="next" aria-label="Próxima página"><svg viewBox="0 0 256 256"><path d="m181.66 133.66l-80 80a8 8 0 0 1-11.32-11.32L164.69 128L90.34 53.66a8 8 0 0 1 11.32-11.32l80 80a8 8 0 0 1 0 11.32"/></svg></button>
    </div>

    <div class="group end">
      <div class="glass seg zoom">
        <button id="zout" aria-label="Afastar"><svg viewBox="0 0 256 256"><path d="M224 128a8 8 0 0 1-8 8H40a8 8 0 0 1 0-16h176a8 8 0 0 1 8 8"/></svg></button>
        <button id="zval" aria-label="Voltar ao tamanho inteiro">100%</button>
        <button id="zin" aria-label="Aproximar"><svg viewBox="0 0 256 256"><path d="M224 128a8 8 0 0 1-8 8h-80v80a8 8 0 0 1-16 0v-80H40a8 8 0 0 1 0-16h80V40a8 8 0 0 1 16 0v80h80a8 8 0 0 1 8 8"/></svg></button>
      </div>
    </div>
  </footer>
</main>

<script>
// Jornal TT 07 · prévia folheável.
// Quatro folhas (frente e verso), oito páginas. Cada folha é uma corrente de tiras verticais:
// a tira 0 gira na dobra (ângulo a) e a ponta solta persegue o alvo (ângulo e). As tiras do meio
// ficam entre os dois, então o papel curva. Duas molas dão o atraso: a ponta vai na frente, a dobra segue.

(() => {
  const N = 4;                 // folhas
  const S = 14;                // tiras por folha (igual a --strips no CSS)
  const ZMAX = 3.2;
  const $ = (id) => document.getElementById(id);
  const stage = $('stage'); const zoomer = $('zoomer'); const book = $('book');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  // --- montagem ---
  for (const side of ['l', 'r']) { const u = document.createElement('div'); u.className = `under ${side}`; book.append(u); }
  const under = { l: book.querySelector('.under.l'), r: book.querySelector('.under.r') };
  const leaves = [];
  for (let i = 0; i < N; i++) {
    const el = document.createElement('div'); el.className = 'leaf';
    el.style.setProperty('--front', `url(assets/p${2 * i + 1}.jpg?v=7)`);
    el.style.setProperty('--back', `url(assets/p${2 * i + 2}.jpg?v=7)`);
    el.dataset.i = i;
    let parent = el;
    for (let k = 0; k < S; k++) {
      const s = document.createElement('div'); s.className = 'strip'; s.setAttribute('style', `--k:${k};`);
      s.innerHTML = '<div class="f front"></div><div class="f back"></div>';
      parent.append(s); parent = s;
    }
    book.append(el);
    leaves.push({ el, a: 0, va: 0, e: 0, ve: 0, T: 0, held: false, cf: 0, cb: 0 });
  }

  // --- medidas: a página tem 320 x 500 mm ---
  // W0 é a largura da página na tela sem zoom. Com zoom, o jornal é remontado no tamanho real (W),
  // em vez de esticar a imagem pronta: é isso que mantém o texto nítido.
  let W0 = 0; let W = 0; let H = 0; let w0 = 0; let real = 1; let zc = 1;
  function size() {
    const r = stage.getBoundingClientRect();
    // largura múltipla do número de tiras: cada tira cai em pixel inteiro. 7% de folga em cima e embaixo.
    w0 = Math.floor(Math.min(r.height * 0.86, (r.width - 48) / 2 / 0.64) * 0.64 / S);
    W0 = w0 * S;
    layout(); clampPan(); wake();
  }
  function layout() {
    const w = Math.max(1, Math.round(w0 * zc)); real = w / w0;
    W = w * S; H = Math.round(W / 0.64);
    const sc = book.parentElement.style;
    sc.setProperty('--W', `${W}px`); sc.setProperty('--H', `${H}px`); sc.setProperty('--w', `${w}px`);
    sc.setProperty('--persp', `${Math.round(3400 * real)}px`);
    if (W * (devicePixelRatio || 1) > 1250) sharpen();
  }
  // páginas em alta (2400 de largura): entram quando a página passa do tamanho da versão de leitura
  let sharp = false;
  function sharpen() {
    if (sharp) return; sharp = true;
    leaves.forEach((L, i) => [['--front', 2 * i + 1], ['--back', 2 * i + 2]].forEach(([prop, n]) => {
      const im = new Image(); im.onload = () => L.el.style.setProperty(prop, `url(assets/hi/p${n}.jpg?v=7)`); im.src = `assets/hi/p${n}.jpg?v=7`;
    }));
  }

  // --- páginas ---
  let cur = 0;                 // folhas viradas: 0 = capa, 4 = contracapa
  const timers = [];
  function go(n) {
    n = clamp(n, 0, N); if (n === cur) return;
    timers.splice(0).forEach(clearTimeout);
    const fwd = n > cur; const list = [];
    if (fwd) for (let i = cur; i < n; i++) list.push(i); else for (let i = cur - 1; i >= n; i--) list.push(i);
    list.forEach((i, j) => timers.push(setTimeout(() => { leaves[i].T = fwd ? 180 : 0; wake(); }, j * 130)));
    cur = n; ui();
  }
  function ui() {
    $('prev').disabled = cur === 0; $('next').disabled = cur === N;
    for (const b of $('seg').children) b.setAttribute('aria-pressed', String(+b.dataset.go === cur));
  }

  // --- zoom e deslocamento ---
  const view = { z: 1, x: 0, y: 0, tz: 1, tx: 0, ty: 0 };
  function clampPan() {
    const r = stage.getBoundingClientRect();
    const mx = Math.max(0, (W0 * 2 * view.tz - r.width) / 2 + 40);
    const my = Math.max(0, (W0 / 0.64 * view.tz - r.height) / 2 + 40);
    view.tx = clamp(view.tx, -mx, mx); view.ty = clamp(view.ty, -my, my);
  }
  function zoomTo(z, cx, cy) {   // cx, cy: ponto da tela que fica parado (padrão: centro do palco)
    z = clamp(z, 1, ZMAX);
    const r = stage.getBoundingClientRect();
    const mx = (cx ?? r.left + r.width / 2) - (r.left + r.width / 2);
    const my = (cy ?? r.top + r.height / 2) - (r.top + r.height / 2);
    const k = z / view.tz;
    view.tx = mx - (mx - view.tx) * k; view.ty = my - (my - view.ty) * k; view.tz = z;
    if (z === 1) { view.tx = 0; view.ty = 0; }
    clampPan(); wake();
  }

  // --- laço ---
  let raf = 0; let last = 0;
  function wake() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); } }
  function spring(x, v, target, k, c, dt) { const acc = (target - x) * k - v * c; v += acc * dt; return [x + v * dt, v]; }
  function tick(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    const sub = Math.max(1, Math.ceil(dt / 0.008)); const h = dt / sub;   // passos de até 8 ms: em tela lenta a folha pula quadros, não fica em câmera lenta
    let moving = false;
    for (const L of leaves) {
      if (still && !L.held) { L.e = L.a = L.T; L.ve = L.va = 0; }
      else for (let i = 0; i < sub; i++) {
        [L.e, L.ve] = spring(L.e, L.ve, L.T, L.held ? 420 : 34, L.held ? 36 : 10.4, h);
        [L.a, L.va] = spring(L.a, L.va, L.e, 110, 15.5, h);
        L.e = clamp(L.e, 0, 180); L.a = clamp(L.a, 0, 180);
      }
      if (Math.abs(L.e - L.T) + Math.abs(L.a - L.e) + Math.abs(L.ve) + Math.abs(L.va) > 0.02 || L.held) moving = true;
      else { L.e = L.a = L.T; L.ve = L.va = 0; }
    }
    // sombra da folha que passa sobre as vizinhas
    leaves.forEach((L, i) => {
      const p = (L.a + L.e) / 360; const s = Math.sin(Math.PI * p) * 0.34;
      L.p = p; L.castR = s * (1 - p); L.castL = s * p;
    });
    leaves.forEach((L, i) => {
      const d = (L.e - L.a) / (S - 1);
      // Ordem das folhas: não dá para confiar no sorteio 3D do navegador com folhas quase no mesmo plano.
      // Folha parada e coberta por outra parada some; a que está no ar sobe alguns pixels.
      const rest0 = L.p < 0.0005; const rest1 = L.p > 0.9995;
      const covered = (rest0 && i > 0 && leaves[i - 1].p < 0.0005) || (rest1 && i < N - 1 && leaves[i + 1].p > 0.9995);
      L.el.style.visibility = covered ? 'hidden' : 'visible';
      const z = rest0 || rest1 ? 0 : 4 + (L.p < 0.5 ? N - i : i + 1) * 1.5;
      L.el.style.transform = `translateZ(${z.toFixed(2)}px)`;
      L.el.style.setProperty('--a', L.a.toFixed(3)); L.el.style.setProperty('--d', d.toFixed(4));
      L.el.style.setProperty('--cf', (i > 0 ? leaves[i - 1].castR : 0).toFixed(3));
      L.el.style.setProperty('--cb', (i < N - 1 ? leaves[i + 1].castL : 0).toFixed(3));
    });
    // sombra na mesa: acompanha a largura que a folha de fora ocupa naquele lado
    const cosA = (L) => Math.cos((L.a + L.e) / 2 * Math.PI / 180);
    under.l.style.transform = `translateZ(-2px) scaleX(${Math.max(0, -cosA(leaves[0])).toFixed(4)})`;
    under.r.style.transform = `translateZ(-2px) scaleX(${Math.max(0, cosA(leaves[N - 1])).toFixed(4)})`;
    const shift = (-W / 2) * (1 - leaves[0].p) + (W / 2) * leaves[N - 1].p;
    book.style.transform = `translateX(${shift.toFixed(2)}px)`;

    // vista
    const f = still ? 1 : 1 - Math.exp(-dt * 14);
    view.z += (view.tz - view.z) * f; view.x += (view.tx - view.x) * f; view.y += (view.ty - view.y) * f;
    if (Math.abs(view.tz - view.z) + Math.abs(view.tx - view.x) + Math.abs(view.ty - view.y) > 0.01) moving = true;
    else {
      view.z = view.tz; view.x = view.tx; view.y = view.ty;
      if (Math.abs(zc - view.tz) > 0.001) {   // zoom assentou: remonta no tamanho real
        zc = view.tz; layout();
        // o zoom se ajusta ao tamanho em que cada tira cai em pixel inteiro; com escala 1 exata não aparece emenda entre tiras
        zc = view.tz = view.z = real; view.tx = view.x = Math.round(view.x); view.ty = view.y = Math.round(view.y);
        moving = true;
      }
    }
    zoomer.style.transform = `translate(${view.x.toFixed(2)}px, ${view.y.toFixed(2)}px) scale(${(view.z / real).toFixed(5)})`;
    $('zval').textContent = `${Math.round(view.tz * 100)}%`;
    $('zout').disabled = view.tz <= 1.001; $('zin').disabled = view.tz >= ZMAX - 0.03;
    stage.classList.toggle('zoomed', view.tz > 1.02);

    raf = moving ? requestAnimationFrame(tick) : 0;
  }

  // --- ponteiro: com zoom, desloca; sem zoom, pega a folha pela ponta ---
  let drag = null;
  const spine = () => { const r = stage.getBoundingClientRect(); const shift = (-W0 / 2) * (1 - leaves[0].p) + (W0 / 2) * leaves[N - 1].p; return r.left + r.width / 2 + shift; };
  const edge = (x, sx) => Math.acos(clamp((x - sx) / W0, -1, 1)) * 180 / Math.PI;
  stage.addEventListener('pointerdown', (ev) => {
    if (ev.button !== 0) return;
    try { stage.setPointerCapture(ev.pointerId); } catch { /* ponteiro sintético */ } stage.classList.add('dragging');
    if (view.tz > 1.02) { drag = { pan: true, x: ev.clientX, y: ev.clientY, tx: view.tx, ty: view.ty }; return; }
    const sx = spine(); const right = ev.clientX >= sx;
    const i = right ? cur : cur - 1;
    if (i < 0 || i >= N) { drag = { none: true }; return; }
    drag = { i, sx, x0: ev.clientX, moved: false, from: right ? 0 : 180, lastX: ev.clientX, lastT: ev.timeStamp, vx: 0 };
  });
  stage.addEventListener('pointermove', (ev) => {
    if (!drag || drag.none) return;
    if (drag.pan) { view.tx = drag.tx + ev.clientX - drag.x; view.ty = drag.ty + ev.clientY - drag.y; clampPan(); view.x = view.tx; view.y = view.ty; wake(); return; }
    if (!drag.moved && Math.abs(ev.clientX - drag.x0) < 6) return;
    if (!drag.moved) { drag.moved = true; timers.splice(0).forEach(clearTimeout); }
    const L = leaves[drag.i]; L.held = true; L.T = edge(ev.clientX, drag.sx);
    const dtm = Math.max(1, ev.timeStamp - drag.lastT); drag.vx = (ev.clientX - drag.lastX) / dtm; drag.lastX = ev.clientX; drag.lastT = ev.timeStamp;
    wake();
  });
  function release() {
    stage.classList.remove('dragging');
    if (drag && drag.moved) {
      const L = leaves[drag.i]; L.held = false;
      const flick = Math.abs(drag.vx) > 0.45;           // px por ms: um peteleco decide o lado
      const over = flick ? drag.vx < 0 : L.T > 90;
      L.T = over ? 180 : 0;
      cur = leaves.filter((l) => l.T === 180).length; ui(); wake();
    }
    drag = null;
  }
  stage.addEventListener('pointerup', release); stage.addEventListener('pointercancel', release);
  stage.addEventListener('dblclick', (ev) => { if (view.tz > 1.02) zoomTo(1); else zoomTo(2.2, ev.clientX, ev.clientY); });
  stage.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    if (view.tz > 1.02 && !ev.ctrlKey && Math.abs(ev.deltaX) > Math.abs(ev.deltaY)) { view.tx -= ev.deltaX; clampPan(); wake(); return; }
    zoomTo(view.tz * Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.01 : 0.0016)), ev.clientX, ev.clientY);
  }, { passive: false });

  // --- botões e teclado ---
  $('prev').onclick = () => go(cur - 1); $('next').onclick = () => go(cur + 1);
  $('seg').onclick = (ev) => { const b = ev.target.closest('button'); if (b) go(+b.dataset.go); };
  $('zin').onclick = () => zoomTo(view.tz * 1.5); $('zout').onclick = () => zoomTo(view.tz / 1.5);
  $('zval').onclick = () => zoomTo(1);
  addEventListener('keydown', (ev) => {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    const k = ev.key;
    if (k === 'ArrowRight' || k === 'PageDown') go(cur + 1);
    else if (k === 'ArrowLeft' || k === 'PageUp') go(cur - 1);
    else if (k === 'Home') go(0); else if (k === 'End') go(N);
    else if (k === '+' || k === '=') zoomTo(view.tz * 1.5);
    else if (k === '-') zoomTo(view.tz / 1.5);
    else if (k === '0' || k === 'Escape') zoomTo(1);
    else if (k >= '1' && k <= '5') go(+k - 1);
    else return;
    ev.preventDefault();
  });
  addEventListener('resize', size);

  // --- entrada: só aparece com a capa carregada; o resto carrega atrás ---
  const first = new Image(); first.onload = first.onerror = () => book.classList.add('on'); first.src = 'assets/p1.jpg?v=7';
  for (let n = 2; n <= 8; n++) { const im = new Image(); im.src = `assets/p${n}.jpg?v=7`; }
  leaves.forEach((L) => { L.p = 0; });
  size(); ui();
  // #debug: avança a física sem depender do relógio da tela (teste em aba oculta, onde o navegador pausa a animação)
  if (location.hash === '#debug') window.jornal = { step(n = 1) { for (let i = 0; i < n; i++) { last = performance.now() - 16; tick(performance.now()); } }, go, leaves };
})();

</script>
