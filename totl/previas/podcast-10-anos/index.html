<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<title>Podcast 10 anos · Turn On The Light · Prévia</title>
<link rel="icon" type="image/svg+xml" href="../../../studio/hub/assets/favicon.svg">
<style>
/* Visor de prévias da TOTL. Nasceu do visor de produtos da Band (band/produtos/_viewer) com a pele da TT.
   Compartilhado por totl/previas/<projeto>/: cada projeto só traz data.js e assets/.
   Sistema: Apple escuro (números do apple-metrics.swift), Geist no lugar da SF, Phosphor no lugar dos SF Symbols.
   Cor: só a da TT (preto, branco #F2F2F2, verde #57F287), regra da frente. */
:root {
  --bg: #000000;                          /* preto TT */
  --label: #F2F2F2;                       /* branco TT */
  --secondary: rgba(242, 242, 242, 0.55);
  --tertiary: rgba(242, 242, 242, 0.32);
  --separator: rgba(242, 242, 242, 0.12);
  --stage-bg: #0B0B0B;
  --accent: #57F287;                      /* verde TT: só seleção e foco */
  --dot-light: #57F287;                   /* luz dos pontos em volta do ponteiro */
  --color-dot-base: rgba(242, 242, 242, 0.16);
  --stage-w: 1120px;                      /* 16:9, o formato das pranchas */
  --radius-stage: 12px;
  --radius-thumb: 8px;
  --s1: 4px; --s2: 8px; --s3: 16px; --s4: 24px; --s5: 40px;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; }
html, body { background: var(--bg); }
body { font-family: 'Geist', -apple-system, system-ui, sans-serif; color: var(--label); -webkit-font-smoothing: antialiased; }
#dots { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
.page { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 30px 16px 56px; }

.collab { display: flex; align-items: center; gap: 14px; height: 40px; }
.collab .bova { height: 20.4px; width: auto; }
.collab .tt { height: 30px; width: auto; }
.collab .x { font-size: 15.6px; color: var(--secondary); line-height: 1; }

.head { width: min(var(--stage-w), 100%); margin-top: 40px; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.head h1 { font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em; }
.head p { font-size: 13px; line-height: 16px; color: var(--secondary); text-align: right; }

.stage { position: relative; width: min(var(--stage-w), 100%); aspect-ratio: 16 / 9; margin-top: 16px; border-radius: var(--radius-stage); overflow: hidden; background: var(--stage-bg); touch-action: pan-y; outline: 0.5px solid var(--separator); outline-offset: -0.5px; }
.stage img.photo { width: 100%; height: 100%; object-fit: contain; display: block; transition: opacity 0.16s ease; }
.stage img.photo.cover { object-fit: cover; }
.stage img.photo.fade { opacity: 0; }
.stage:fullscreen { background: #000; border-radius: 0; width: 100vw; height: 100vh; aspect-ratio: auto; outline: none; }
.stage:fullscreen img.photo { object-fit: contain; }

/* Liquid Glass sobre escuro: o mesmo vidro do visor da Band, com a sombra um pouco mais funda. */
.glass {
  background: rgba(255, 255, 255, 0.08);
  border: 0.5px solid rgba(255, 255, 255, 0.28);
  -webkit-backdrop-filter: blur(6px) saturate(1.6) brightness(0.9);
  backdrop-filter: blur(6px) saturate(1.6) brightness(0.9);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35),
    inset 0 1px 0.5px rgba(255, 255, 255, 0.45),
    inset 0 -1px 0.5px rgba(255, 255, 255, 0.10),
    inset 1px 0 0.5px rgba(255, 255, 255, 0.12),
    inset -1px 0 0.5px rgba(255, 255, 255, 0.12);
  color: #fff;
}
button.glass, a.glass { position: absolute; width: 36px; height: 36px; border-radius: 18px; display: grid; place-items: center; cursor: pointer; padding: 0; transition: transform 0.15s ease, background 0.15s ease; }
button.glass:hover, a.glass:hover { background: rgba(255, 255, 255, 0.16); }
button.glass:active, a.glass:active { transform: scale(0.94); }
button.glass:disabled { opacity: 0.3; cursor: default; }
button.glass:focus-visible, a.glass:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.glass svg { width: 16px; height: 16px; fill: currentColor; }
.prev { left: 16px; top: calc(50% - 18px); }
.next { right: 16px; top: calc(50% - 18px); }
.full { right: 60px; top: 16px; }
.down { right: 16px; top: 16px; }
.caption { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: baseline; gap: 10px; padding: 9px 16px; border-radius: 18px; white-space: nowrap; max-width: calc(100% - 32px); }
.caption b { font-size: 15px; line-height: 20px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.caption span { font-size: 13px; line-height: 16px; color: rgba(255, 255, 255, 0.7); font-variant-numeric: tabular-nums; }

.note { width: min(var(--stage-w), 100%); margin-top: 14px; font-size: 13px; line-height: 18px; color: var(--secondary); min-height: 18px; }

/* Miniaturas em grupos: cada grupo é uma etapa do que se mostra (símbolo, tipografia, cenário). */
.groups { width: min(var(--stage-w), 100%); margin-top: 24px; display: flex; flex-direction: column; gap: 20px; }
.group h2 { font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--tertiary); margin-bottom: 10px; }
.thumbs { display: flex; gap: 16px; overflow-x: auto; padding: 2px; scrollbar-width: none; }
.thumbs::-webkit-scrollbar { display: none; }
.thumbs button { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 8px; width: 176px; flex: none; }
.thumbs img { width: 176px; height: 99px; object-fit: cover; border-radius: var(--radius-thumb); background: var(--stage-bg); display: block; outline: 2px solid transparent; outline-offset: -2px; transition: outline-color 0.15s ease, opacity 0.15s ease; opacity: 0.72; }
.thumbs button:hover img { opacity: 1; }
.thumbs span { font-size: 11px; line-height: 14px; color: var(--secondary); }
.thumbs [aria-current="true"] img { outline-color: var(--accent); opacity: 1; }
.thumbs [aria-current="true"] span { color: var(--label); font-weight: 500; }
.thumbs button:focus-visible img { outline-color: var(--accent); opacity: 1; }

@media (max-width: 600px) {
  .head { margin-top: 28px; flex-direction: column; gap: 2px; }
  .head p { text-align: left; }
  .caption { padding: 7px 14px; }
  .caption span { display: none; }
  .prev, .next { top: auto; bottom: 14px; }
  .thumbs { gap: 10px; }
  .thumbs button, .thumbs img { width: 128px; } .thumbs img { height: 72px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

</style>
</head>
<body>
<canvas id="dots" aria-hidden="true"></canvas>
<main class="page">
  <p class="collab" aria-label="Bova Studio e Turn On The Light">
    <img class="bova" src="../assets/bova.svg" alt="Bova Studio">
    <span class="x" aria-hidden="true">×</span>
    <img class="tt" src="../assets/tt.svg" alt="Turn On The Light">
  </p>
  <header class="head"><h1 id="ptitle"></h1><p id="plead"></p></header>
  <section class="stage" id="stage" aria-label="Imagens do projeto">
    <img class="photo" id="photo" alt="">
    <button class="glass prev" id="prev" aria-label="Imagem anterior"><svg viewBox="0 0 256 256"><path d="M165.66 202.34a8 8 0 0 1-11.32 11.32l-80-80a8 8 0 0 1 0-11.32l80-80a8 8 0 0 1 11.32 11.32L91.31 128Z"/></svg></button>
    <button class="glass next" id="next" aria-label="Próxima imagem"><svg viewBox="0 0 256 256"><path d="m181.66 133.66l-80 80a8 8 0 0 1-11.32-11.32L164.69 128L90.34 53.66a8 8 0 0 1 11.32-11.32l80 80a8 8 0 0 1 0 11.32"/></svg></button>
    <button class="glass full" id="full" aria-label="Tela cheia"><svg viewBox="0 0 256 256"><path d="M216 48v48a8 8 0 0 1-16 0V67.31l-42.34 42.35a8 8 0 0 1-11.32-11.32L188.69 56H160a8 8 0 0 1 0-16h48a8 8 0 0 1 8 8M98.34 146.34L56 188.69V160a8 8 0 0 0-16 0v48a8 8 0 0 0 8 8h48a8 8 0 0 0 0-16H67.31l42.35-42.34a8 8 0 0 0-11.32-11.32M208 152a8 8 0 0 0-8 8v28.69l-42.34-42.35a8 8 0 0 0-11.32 11.32L188.69 200H160a8 8 0 0 0 0 16h48a8 8 0 0 0 8-8v-48a8 8 0 0 0-8-8M67.31 56H96a8 8 0 0 0 0-16H48a8 8 0 0 0-8 8v48a8 8 0 0 0 16 0V67.31l42.34 42.35a8 8 0 0 0 11.32-11.32Z"/></svg></button>
    <a class="glass down" id="down" aria-label="Baixar imagem em tamanho cheio"><svg viewBox="0 0 256 256"><path d="M224 144v64a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8v-64a8 8 0 0 1 16 0v56h160v-56a8 8 0 0 1 16 0m-101.66 5.66a8 8 0 0 0 11.32 0l40-40a8 8 0 0 0-11.32-11.32L136 124.69V32a8 8 0 0 0-16 0v92.69L93.66 98.34a8 8 0 0 0-11.32 11.32Z"/></svg></a>
    <p class="glass caption" aria-live="polite"><b id="ctitle"></b><span id="ccount"></span></p>
  </section>
  <p class="note" id="note"></p>
  <div class="groups" id="groups"></div>
</main>
<script>
// Podcast 10 anos (Job 027, marca Beyond The Light). Só o conteúdo; o visor está em ../_viewer/.
// Na página vai só o nome do que é: nada de medida, processo, versão ou ferramenta (regra do Bova, 19/11/2026).
// Direção aprovada pelo Bova em 24/11/2026: caixa de luz com Schibsted Grotesk Bold.
window.PROJECT = {
  client: 'Turn On The Light',
  title: 'Beyond The Light',
  lead: 'Marca do podcast dos 10 anos',
  groups: [
    { title: 'No cenário', views: [
      { id: 'cenario', label: 'Cenário', title: 'Cenário', fit: 'cover', download: 'beyond-the-light_cenario.jpg' },
      { id: 'letreiro', label: 'Letreiro', title: 'Letreiro', fit: 'cover', download: 'beyond-the-light_letreiro.jpg' },
    ] },
    { title: 'Aplicações', views: [
      { id: 'caneca', label: 'Caneca', title: 'Caneca', fit: 'cover', download: 'beyond-the-light_caneca.jpg' },
      { id: 'microfone', label: 'Microfone', title: 'Microfone', fit: 'cover', download: 'beyond-the-light_microfone.jpg' },
      { id: 'quadro', label: 'Quadro', title: 'Quadro', fit: 'cover', download: 'beyond-the-light_quadro.jpg' },
    ] },
    { title: 'Marca', views: [
      { id: 'positivo', label: 'Positivo', title: 'Marca em positivo', download: 'beyond-the-light_positivo.png' },
      { id: 'negativo', label: 'Negativo', title: 'Marca em negativo', download: 'beyond-the-light_negativo.png' },
      { id: 'malha', label: 'Construção', title: 'Construção', download: 'beyond-the-light_malha.png' },
      { id: 'simbolo', label: 'Símbolo', title: 'Símbolo', download: 'beyond-the-light_simbolo.png' },
      { id: 'assinaturas', label: 'Assinaturas', title: 'Assinaturas', download: 'beyond-the-light_assinaturas.png' },
    ] },
  ],
};

</script>
<script>
// Visor de prévias da TOTL. Lê window.PROJECT (data.js do projeto) e monta a página.
// Diferenças para o visor da Band: vistas em grupos, contador na legenda, nota curta por vista,
// encaixe por vista (contain para prancha, cover para foto) e Home/End no teclado.
// Imagens: assets/img/<id>.jpg (visor), assets/th/<id>.jpg (miniatura) e assets/full/<arquivo> (download).
// Endereço: #<id da vista>. Teclado: setas, Home, End. Toque: arrastar para o lado.
(() => {
  const P = window.PROJECT;
  const $ = (id) => document.getElementById(id);
  const views = P.groups.flatMap((g) => g.views.map((v) => ({ ...v, group: g.title })));

  document.title = `${P.title} · ${P.client} · Prévia`;
  $('ptitle').textContent = P.title;
  $('plead').textContent = P.lead || '';

  const btns = [];
  P.groups.forEach((g) => {
    const sec = document.createElement('section'); sec.className = 'group';
    sec.innerHTML = `<h2>${g.title}</h2><nav class="thumbs" aria-label="${g.title}"></nav>`;
    const nav = sec.querySelector('nav');
    g.views.forEach((v) => {
      const n = views.findIndex((w) => w.id === v.id);
      const b = document.createElement('button');
      b.setAttribute('aria-label', `${v.label}, imagem ${n + 1} de ${views.length}`);
      b.innerHTML = `<img src="assets/th/${v.id}.jpg" alt="" loading="lazy"><span>${v.label}</span>`;
      b.onclick = () => show(n);
      nav.append(b); btns[n] = b;
    });
    $('groups').append(sec);
  });

  let i = 0;
  function show(m, instant) {
    i = Math.max(0, Math.min(views.length - 1, m));
    const v = views[i]; const photo = $('photo');
    const swap = () => { photo.src = `assets/img/${v.id}.jpg`; photo.alt = `${P.title}: ${v.title}`; photo.classList.toggle('cover', v.fit === 'cover'); };
    if (instant || !photo.getAttribute('src')) swap();
    else { photo.classList.add('fade'); setTimeout(() => { swap(); photo.decode().catch(() => {}).finally(() => photo.classList.remove('fade')); }, 160); }
    $('ctitle').textContent = v.title; $('ccount').textContent = `${i + 1} / ${views.length}`;
    $('note').textContent = v.note || '';
    $('down').href = `assets/full/${v.download}`; $('down').setAttribute('download', v.download);
    $('prev').disabled = i === 0; $('next').disabled = i === views.length - 1;
    btns.forEach((b, t) => b.setAttribute('aria-current', String(t === i)));
    // Só a faixa rola, na horizontal: scrollIntoView rolava a janela e a página abria no meio.
    const b = btns[i]; const nav = b.parentElement;
    nav.scrollTo({ left: b.offsetLeft - nav.offsetLeft - (nav.clientWidth - b.clientWidth) / 2, behavior: instant ? 'auto' : 'smooth' });
    for (const d of [1, -1]) { const p = views[i + d]; if (p) new Image().src = `assets/img/${p.id}.jpg`; }
    history.replaceState(null, '', `#${v.id}`);
  }

  $('prev').onclick = () => show(i - 1);
  $('next').onclick = () => show(i + 1);
  $('full').onclick = () => {
    const s = $('stage');
    if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else (s.requestFullscreen || s.webkitRequestFullscreen).call(s);
  };
  addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('input, textarea')) return;
    if (e.key === 'ArrowLeft') show(i - 1); if (e.key === 'ArrowRight') show(i + 1);
    if (e.key === 'Home') { e.preventDefault(); show(0); }
    if (e.key === 'End') { e.preventDefault(); show(views.length - 1); }
  });
  let x0 = null;
  $('stage').addEventListener('pointerdown', (e) => { if (!e.target.closest('.glass')) x0 = e.clientX; });
  $('stage').addEventListener('pointerup', (e) => { if (x0 === null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 40) show(i + (dx < 0 ? 1 : -1)); });

  const start = Math.max(0, views.findIndex((v) => v.id === location.hash.slice(1)));
  show(start, true);
})();

</script>
<script>
// Cópia do band/produtos/_viewer/dots.js para o visor de prévias da TOTL (cores vêm do viewer.css).
// (sólida, troca com o tema) no lugar do branco a 7%, que some no modo claro.
// Campo de pontos do fundo da página: o pattern da Bova (ponto de 2 px em grade de 16) que
// acende como luz em volta do ponteiro. A cor vem de --dot-light; a base, de --dot-base.
// Sem ponteiro (toque, ou antes do primeiro movimento) a luz descansa no canto de baixo à direita.
// prefers-reduced-motion: a luz não segue o ponteiro, fica parada nesse canto.

(() => {
  const cv = document.getElementById('dots');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const hex = (v, d) => (v || d).trim();
  let rgb = [0, 0, 0]; let BASE = '#1E1E1E';
  function colors() {
    const css = getComputedStyle(document.documentElement);
    const LIGHT = hex(css.getPropertyValue('--dot-light'), '#7C94D5');
    rgb = [1, 3, 5].map((i) => parseInt(LIGHT.slice(i, i + 2), 16));
    BASE = hex(css.getPropertyValue('--color-dot-base'), '#1E1E1E');
  }
  colors();
  const GRID = 16;
  const RADIUS = 220;          // alcance da luz, em px
  const BASE_ALPHA = 0.07;     // ponto apagado
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 0; let H = 0; let dpr = 1;
  const rest = () => ({ x: W - 24, y: H * 0.6 }); // margem direita, atrás dos cards e longe do rodapé (no dashboard)
  let target = null; let pos = null; let raf = 0;

  function size() {
    dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!target) target = rest();
    if (!pos) pos = { ...target };
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const r2 = RADIUS * RADIUS;
    for (let y = GRID / 2; y < H; y += GRID) {
      for (let x = GRID / 2; x < W; x += GRID) {
        const dx = x - pos.x; const dy = y - pos.y;
        const lv = Math.exp(-(dx * dx + dy * dy) / r2 * 2.2);
        const a = BASE_ALPHA + lv * 0.85;
        const rr = 1 + lv * 0.9;
        ctx.fillStyle = lv > 0.02
          ? `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a.toFixed(3)})`
          : BASE;
        ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  // A luz segue o ponteiro com atraso (lerp), para ler como luz e não como cursor.
  function tick() {
    pos.x += (target.x - pos.x) * 0.14;
    pos.y += (target.y - pos.y) * 0.14;
    draw();
    raf = Math.hypot(target.x - pos.x, target.y - pos.y) > 0.5 ? requestAnimationFrame(tick) : 0;
  }
  function aim(x, y) {
    target = { x, y };
    if (!raf) raf = requestAnimationFrame(tick);
  }

  addEventListener('resize', size);
  matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { colors(); draw(); });
  if (!still) {
    addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') aim(e.clientX, e.clientY); }, { passive: true });
    document.addEventListener('mouseleave', () => { const r = rest(); aim(r.x, r.y); });
  }
  size();
})();

</script>
</body>
</html>
